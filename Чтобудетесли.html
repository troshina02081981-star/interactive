<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажер: Изоляция контуров</title>
<style>
  body { font-family: sans-serif; padding: 15px; background: #fff; color: #333; margin: 0; display: flex; flex-direction: column; align-items: center; }
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 16px; margin: 0 0 5px; text-transform: uppercase; }
  .header p { font-size: 13px; color: #666; margin: 0; max-width: 500px; line-height: 1.4; }
  
  .game-board { display: flex; justify-content: space-between; gap: 15px; width: 100%; max-width: 650px; margin-bottom: 20px; }
  .column { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  
  .item {
    background: #f9f9f9; border: 2px solid #e0e0e0; border-radius: 6px; padding: 12px;
    font-size: 13px; cursor: pointer; text-align: center; transition: all 0.2s;
    min-height: 40px; display: flex; align-items: center; justify-content: center;
  }
  .item:hover { border-color: #4a90e2; background: #f0f7ff; }
  .item.selected { border-color: #4a90e2; background: #eef5ff; transform: scale(1.02); }
  
  /* Зеленый при правильном ответе */
  .item.correct { border-color: #27ae60; background: #e8f8f5; color: #27ae60; cursor: default; pointer-events: none; font-weight: bold; }
  
  /* Красный при неправильном ответе */
  .item.wrong { border-color: #d32f2f; background: #fdedec; color: #d32f2f; animation: shake 0.3s; }
  
  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
  }

  .msg { font-size: 14px; font-weight: bold; text-align: center; min-height: 20px; margin-top: 10px; }
  .msg.ok { color: #27ae60; }
  .msg.err { color: #d32f2f; }
</style>
</head>
<body>

<div class="header">
  <h1>Что будет, если…</h1>
  <p>Нажмите на ошибку в левой колонке, а затем на ее последствие в правой.</p>
</div>

<div class="game-board">
  <!-- Причины (ошибки) -->
  <div class="column" id="colLeft">
    <div class="item" data-id="1">Нет диода данных</div>
    <div class="item" data-id="2">Двойник связан с контуром управления</div>
    <div class="item" data-id="3">Телеметрия идёт в обе стороны</div>
  </div>
  
  <!-- Последствия -->
  <div class="column" id="colRight">
    <div class="item" data-id="3">Уязвимость для кибератаки извне</div>
    <div class="item" data-id="1">Риск несанкционированного вмешательства</div>
    <div class="item" data-id="2">Отказ в согласовании с ФСТЭК</div>
  </div>
</div>

<div class="msg" id="msg"></div>

<script>
  let selectedLeft = null;
  let matches = 0;
  let isAnimating = false; // Блокировка кликов во время анимации
  
  const leftItems = document.querySelectorAll('#colLeft .item');
  const rightItems = document.querySelectorAll('#colRight .item');
  const msg = document.getElementById('msg');

  // Выбор ошибки слева
  leftItems.forEach(item => {
    item.addEventListener('click', () => {
      if (isAnimating) return;
      leftItems.forEach(i => i.classList.remove('selected'));
      item.classList.add('selected');
      selectedLeft = item;
      msg.textContent = '';
    });
  });

  // Выбор последствия справа
  rightItems.forEach(item => {
    item.addEventListener('click', () => {
      if (isAnimating) return;
      
      if (!selectedLeft) {
        msg.textContent = 'Сначала выберите ошибку слева.';
        msg.className = 'msg err';
        return;
      }

      const leftId = selectedLeft.dataset.id;
      const rightId = item.dataset.id;

      if (leftId === rightId) {
        // Верно
        selectedLeft.classList.remove('selected');
        selectedLeft.classList.add('correct');
        item.classList.add('correct');
        matches++;
        selectedLeft = null;
        msg.textContent = 'Верно!';
        msg.className = 'msg ok';
        
        if (matches === 3) {
          msg.textContent = 'Отлично! Все три ошибки изоляции найдены.';
        }
      } else {
        // Ошибка
        isAnimating = true;
        const currentLeft = selectedLeft;
        
        currentLeft.classList.remove('selected');
        currentLeft.classList.add('wrong');
        item.classList.add('wrong');
        
        msg.textContent = 'Неверно, попробуйте еще раз.';
        msg.className = 'msg err';
        
        setTimeout(() => {
          currentLeft.classList.remove('wrong');
          item.classList.remove('wrong');
          isAnimating = false;
          selectedLeft = null; // Сбрасываем выбор, чтобы не тянуть старую карточку
        }, 600);
      }
    });
  });
</script>
</body>
</html>
