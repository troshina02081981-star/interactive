<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=560"><title>Матрица ответственности</title>
<style>
*{box-sizing:border-box;font:12px/1.4 system-ui,Arial;margin:0}
body{background:#fff;color:#1f2937;max-width:560px;margin:0 auto;padding:10px}
h1{font-size:14px;margin-bottom:8px;color:#111827}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{border:1px solid #e5e7eb;padding:5px;text-align:center}
th{background:#f8fafc;color:#6b7280;font-size:10px;font-weight:600}
td.role{text-align:left;font-weight:600;color:#111827;background:#fafafa;white-space:nowrap}
td.cell{cursor:pointer;font-size:14px;color:#d1d5db;user-select:none;width:36px}
td.cell:hover{background:#eff6ff}
td.cell.on{color:#16a34a;background:#f0fdf4;font-weight:700}
.res{margin-top:8px;padding:6px 8px;border-radius:4px;font-size:10px;border-left:3px solid #d97706;background:#fffbeb}
.res.ok{border-color:#16a34a;background:#f0fdf4}
.res.bad{border-color:#dc2626;background:#fef2f2}
.legend{font-size:9px;color:#6b7280;margin-top:6px}
</style></head><body>

<h1>Матрица ответственности</h1>

<table id="t">
  <thead><tr>
    <th style="text-align:left">Роль</th>
    <th>Проверяет</th><th>Устраняет</th><th>Подтверждает</th><th>Ограничивает</th><th>Резерв</th>
  </tr></thead>
  <tbody></tbody>
</table>

<div class="res" id="res"></div>
<div class="legend">Клик по ячейке — поставить/снять отметку. Одна роль может закрывать несколько вопросов.</div>

<script>
const ROLES=["Инженер ПБ","Мастер участка","Главный инженер","Руководитель"];
const COLS=["Проверяет","Устраняет","Подтверждает","Ограничивает","Резерв"];
let M={};

function render(){
  const tb=document.querySelector("#t tbody");
  tb.innerHTML=ROLES.map(r=>`<tr>
    <td class="role">${r}</td>
    ${COLS.map(c=>`<td class="cell ${M[r+'-'+c]?'on':''}" onclick="tog('${r}','${c}')">${M[r+'-'+c]?'✔':''}</td>`).join("")}
  </tr>`).join("");

  const need=["Проверяет","Устраняет","Подтверждает","Ограничивает"];
  const miss=need.filter(c=>!ROLES.some(r=>M[r+'-'+c]));
  const noRes=!ROLES.some(r=>M[r+'-Резерв']);
  const el=document.getElementById("res");
  if(!miss.length && !noRes){
    el.className="res ok"; el.textContent="✔ Все четыре вопроса закрыты, резерв назначен";
  }else{
    el.className="res bad";
    el.textContent="⛔ Не закрыто: "+[...miss, ...(noRes?["Резерв"]:[])].join(", ");
  }
}
function tog(r,c){const k=r+'-'+c;M[k]=!M[k];render()}
render();
</script></body></html>
