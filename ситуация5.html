<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задание: ваши действия</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background: #ffffff;
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .task-block {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 30px 34px;
            border: none;
            box-shadow: none;
        }

        @media (max-width: 600px) {
            .task-block {
                padding: 18px 14px;
            }
        }

        /* ===== ЛИСТАЛКА ===== */
        .flip-container {
            position: relative;
            width: 100%;
        }

        .flip-page {
            display: none;
            animation: fadeSlide 0.35s ease;
        }

        .flip-page.active {
            display: block;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateX(18px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* Заголовок задания */
        .task-title {
            font-size: 18px;
            font-weight: 700;
            color: #0b1e33;
            margin-bottom: 6px;
        }

        .task-sub {
            font-size: 15px;
            color: #3d4f62;
            margin-bottom: 18px;
            line-height: 1.6;
        }

        .task-question {
            font-size: 16px;
            font-weight: 600;
            color: #0b1e33;
            margin-bottom: 14px;
        }

        /* Варианты ответов */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border: 2px solid #e2e7ee;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #ffffff;
            font-size: 15px;
            color: #0b1e33;
        }

        .option-item:hover {
            border-color: #b0c7e0;
            background: #f7faff;
        }

        .option-item input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #1a5c9e;
            flex-shrink: 0;
            cursor: pointer;
        }

        .option-item .letter {
            font-weight: 700;
            color: #1a5c9e;
            min-width: 22px;
        }

        /* Кнопка проверки */
        .check-btn {
            background: #1a5c9e;
            color: #ffffff;
            border: none;
            border-radius: 40px;
            padding: 13px 38px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            margin-top: 4px;
        }

        .check-btn:hover {
            background: #12457a;
            transform: scale(1.01);
        }

        .check-btn:disabled {
            background: #c5d2e2;
            cursor: not-allowed;
            transform: none;
        }

        /* Кнопка «назад» */
        .back-btn {
            background: transparent;
            color: #1a5c9e;
            border: 2px solid #1a5c9e;
            border-radius: 40px;
            padding: 12px 32px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            margin-top: 20px;
        }

        .back-btn:hover {
            background: #f7faff;
        }

        /* Результат (страница 2) */
        .result-box {
            padding: 20px 24px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.7;
            border-left: 6px solid #1a5c9e;
            background: #ffffff;
        }

        .result-box.correct {
            border-left-color: #1a7a4a;
        }

        .result-box.incorrect {
            border-left-color: #b13d30;
        }

        .result-box .result-title {
            font-weight: 700;
            font-size: 17px;
            margin-bottom: 6px;
            color: #0b1e33;
        }

        .result-box .result-title .icon {
            margin-right: 8px;
        }

        .result-box .explanation {
            color: #1a2a3a;
            margin-top: 4px;
        }

        .result-box .explanation strong {
            color: #0b1e33;
        }

        .result-box .checklist {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e2e7ee;
        }

        .result-box .checklist .ok {
            color: #1a7a4a;
            font-weight: 600;
        }

        .result-box .checklist .fail {
            color: #b13d30;
            font-weight: 600;
        }

        .result-box .extra-note {
            margin-top: 8px;
            padding: 10px 14px;
            background: #fff8ee;
            border-radius: 10px;
            font-size: 14px;
            color: #7a5a2a;
        }

        .result-box .extra-note strong {
            color: #5a3a1a;
        }
    </style>
</head>
<body>

<div class="task-block">
<div class="flip-container">

    <!-- ================= СТРАНИЦА 1: СИТУАЦИЯ ================= -->
    <div class="flip-page active" id="page1">

        <div class="task-title">🎯 Ситуация</div>
        <div class="task-sub">
            Вы проводите инвентаризацию документов на ОПО и обнаруживаете, что нет лицензии на эксплуатацию взрывопожароопасного объекта. Документ должен был быть, но его нет.
        </div>

        <div class="task-question">Что вы сделаете в первую очередь?</div>

        <div class="options" id="optionsContainer">

            <label class="option-item" id="optA">
                <input type="radio" name="quiz" value="A" />
                <span class="letter">А.</span>
                Продолжу работу, пока никто не заметил
            </label>

            <label class="option-item" id="optB">
                <input type="radio" name="quiz" value="B" />
                <span class="letter">Б.</span>
                Доложу руководителю и опишу риски
            </label>

            <label class="option-item" id="optC">
                <input type="radio" name="quiz" value="C" />
                <span class="letter">В.</span>
                Быстро закажу дубликат через знакомых
            </label>

        </div>

        <button class="check-btn" id="checkBtn" disabled>Проверить ответ</button>

    </div>
    <!-- ================= КОНЕЦ СТРАНИЦЫ 1 ================= -->


    <!-- ================= СТРАНИЦА 2: РЕЗУЛЬТАТ ================= -->
    <div class="flip-page" id="page2">

        <div class="result-box" id="resultBox">
            <div class="result-title">
                <span class="icon" id="resultIcon">✅</span>
                <span id="resultTitle">Разбор ситуации</span>
            </div>
            <div class="explanation" id="resultText"></div>
        </div>

        <button class="back-btn" id="backBtn">← Вернуться к ситуации</button>

    </div>
    <!-- ================= КОНЕЦ СТРАНИЦЫ 2 ================= -->

</div>
</div>

<script>
    (function() {

        const radioButtons = document.querySelectorAll('input[name="quiz"]');
        const checkBtn = document.getElementById('checkBtn');
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultIcon = document.getElementById('resultIcon');
        const resultText = document.getElementById('resultText');

        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const backBtn = document.getElementById('backBtn');

        // Разблокируем кнопку при выборе варианта
        radioButtons.forEach(radio => {
            radio.addEventListener('change', function() {
                checkBtn.disabled = false;
            });
        });

        // Обработчик нажатия кнопки
        checkBtn.addEventListener('click', function() {

            let selectedValue = null;
            for (let rb of radioButtons) {
                if (rb.checked) {
                    selectedValue = rb.value;
                    break;
                }
            }

            if (!selectedValue) return;

            // Подсветка выбранного варианта
            document.querySelectorAll('.option-item').forEach(el => {
                el.style.background = '#ffffff';
                el.style.borderColor = '#e2e7ee';
            });

            let selectedLabel = null;
            if (selectedValue === 'A') selectedLabel = document.getElementById('optA');
            else if (selectedValue === 'B') selectedLabel = document.getElementById('optB');
            else if (selectedValue === 'C') selectedLabel = document.getElementById('optC');

            if (selectedLabel) {
                selectedLabel.style.borderColor = '#1a5c9e';
                selectedLabel.style.background = '#f0f6fe';
            }

            // Определяем правильный ответ
            const isCorrect = (selectedValue === 'B');

            // Настраиваем блок результата
            resultBox.className = 'result-box ' + (isCorrect ? 'correct' : 'incorrect');

            const icon = isCorrect ? '✅' : '❌';
            const title = isCorrect ? 'Верно! Разбор ситуации' : 'Разбор ситуации';

            resultIcon.textContent = icon;
            resultTitle.textContent = title;

            // Если ответ неправильный — пояснение
            let extraNote = '';
            if (!isCorrect) {
                if (selectedValue === 'A') {
                    extraNote = `
                        <p style="margin-top:8px; color:#7a1a1a;">
                            <strong>Обратите внимание:</strong> Работа без лицензии — это нарушение, которое может привести к штрафу, приостановке деятельности и уголовной ответственности. Продолжать работу нельзя.
                        </p>
                    `;
                } else if (selectedValue === 'C') {
                    extraNote = `
                        <p style="margin-top:8px; color:#7a1a1a;">
                            <strong>Обратите внимание:</strong> Дубликаты выдаются только официальными органами. Обращение к "знакомым" — это риск получить поддельный документ, что усугубит проблему.
                        </p>
                    `;
                }
            }

            resultText.innerHTML = `
                <p><strong>Правильный ответ: Б.</strong> Доложу руководителю и опишу риски.</p>
                <p style="margin-top:6px;">
                    Работа без лицензии — это грубое нарушение, которое грозит штрафом, приостановкой деятельности и даже уголовной ответственностью. Первый шаг — сообщить руководителю и зафиксировать проблему. Только после этого — организовать восстановление документа.
                </p>
                ${extraNote}
                <div class="checklist">
                    <span class="fail">✗ Работать без лицензии — недопустимо</span>
                    <span class="ok">✓ Доложить руководителю — верное решение</span>
                    <span class="fail">✗ Дубликат через знакомых — риск подделки</span>
                </div>
                <div class="extra-note">
                    <strong>Важно:</strong> Отсутствие лицензии — это не просто бумажная проблема. Это прямой риск для безопасности и законности работы объекта.
                </div>
            `;

            // Блокируем кнопку и радиокнопки
            checkBtn.disabled = true;
            radioButtons.forEach(rb => rb.disabled = true);

            // Перелистываем на страницу 2
            page1.classList.remove('active');
            page2.classList.add('active');
        });

        // Кнопка «Вернуться к ситуации»
        backBtn.addEventListener('click', function() {
            page2.classList.remove('active');
            page1.classList.add('active');
        });

    })();
</script>

</body>
</html>
