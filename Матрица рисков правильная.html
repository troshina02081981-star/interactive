<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Матрица рисков при отсутствии документов</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #ffffff;
            padding: 25px 15px;
            margin: 0;
        }
        .container {
            max-width: 560px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 22px 26px;
            border: 1px solid #eef2f6;
        }
        h1 {
            font-size: 19px;
            color: #0b1e33;
            margin: 0 0 4px 0;
        }
        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        /* ===== КНИЖКА ===== */
        .book {
            position: relative;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            overflow: hidden;
        }
        .book-track {
            display: flex;
            transition: transform 0.3s ease;
        }
        .page {
            min-width: 100%;
            padding: 16px 18px 18px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
        }
        .page-title {
            font-size: 15px;
            font-weight: 700;
            color: #0b1e33;
            line-height: 1.35;
            flex: 1;
        }
        .page-desc {
            font-size: 12px;
            color: #64748b;
            margin-top: 3px;
            line-height: 1.4;
        }
        .page-badge {
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 30px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .page-badge.critical { background: #fef2f2; color: #b91c1c; }
        .page-badge.high     { background: #fffbeb; color: #b45309; }
        .page-badge.medium   { background: #fefce8; color: #a16207; }
        .page-badge.low      { background: #f0fdf4; color: #15803d; }
        .page-badge.none     { background: #eef2ff; color: #4338ca; }

        /* ===== СТРОКИ ДАННЫХ ===== */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
            gap: 10px;
        }
        .info-row:last-of-type {
            border-bottom: none;
        }
        .info-row .label {
            color: #64748b;
            flex-shrink: 0;
        }
        .info-row .value {
            font-weight: 600;
            color: #0b1e33;
            text-align: right;
        }
        .info-row .value.critical { color: #b91c1c; }
        .info-row .value.high     { color: #b45309; }
        .info-row .value.medium   { color: #a16207; }
        .info-row .value.low      { color: #15803d; }
        .info-row .value.none     { color: #4338ca; }

        .action-box {
            margin-top: 12px;
            background: #f8fafc;
            padding: 12px 14px;
            border-radius: 10px;
            border-left: 3px solid #2563eb;
            font-size: 12.5px;
            line-height: 1.55;
            color: #334155;
        }
        .action-box strong {
            display: block;
            color: #0b1e33;
            margin-bottom: 4px;
            font-size: 13px;
        }

        /* ===== НАВИГАЦИЯ ===== */
        .book-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 14px;
            gap: 10px;
        }
        .nav-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid #d1d9e6;
            background: #ffffff;
            color: #2563eb;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-family: inherit;
        }
        .nav-btn:hover:not(:disabled) {
            background: #eef2ff;
            border-color: #2563eb;
        }
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex: 1;
            flex-wrap: wrap;
        }
        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #cbd5e1;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: 0.2s;
        }
        .dot.active {
            background: #2563eb;
            transform: scale(1.4);
        }
        .counter {
            text-align: center;
            font-size: 11.5px;
            color: #94a3b8;
            margin-top: 8px;
        }

        /* ===== ЛЕГЕНДА ===== */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #eef2f6;
            font-size: 11.5px;
            color: #64748b;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }
        .legend-dot.critical { background: #fecaca; }
        .legend-dot.high     { background: #fde68a; }
        .legend-dot.medium   { background: #fef08a; }
        .legend-dot.low      { background: #bbf7d0; }
        .legend-dot.none     { background: #c7d2fe; }

        @media (max-width: 640px) {
            .container { padding: 18px 14px 20px; }
            h1 { font-size: 17px; }
            .page { padding: 14px 14px 16px; }
            .page-title { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚠️ Матрица рисков при отсутствии документов</h1>
    <div class="subtitle">
        Листайте страницы — каждый документ на отдельной странице. Смотрите штрафы, риски и что делать.
    </div>

    <!-- КНИЖКА -->
    <div class="book">
        <div class="book-track" id="bookTrack">
            <!-- страницы заполняются скриптом -->
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="book-nav">
        <button class="nav-btn" id="prevBtn" title="Назад">‹</button>
        <div class="dots" id="dots"></div>
        <button class="nav-btn" id="nextBtn" title="Вперед">›</button>
    </div>
    <div class="counter" id="counter">1 / 7</div>

    <!-- ЛЕГЕНДА -->
    <div class="legend">
        <span class="legend-item"><span class="legend-dot critical"></span> Критический</span>
        <span class="legend-item"><span class="legend-dot high"></span> Высокий</span>
        <span class="legend-item"><span class="legend-dot medium"></span> Средний</span>
        <span class="legend-item"><span class="legend-dot low"></span> Низкий</span>
        <span class="legend-item"><span class="legend-dot none"></span> Минимальный</span>
    </div>
</div>

<script>
// ================================================================
// ДАННЫЕ
// ================================================================
const DOCS = [
    {
        title: 'Лицензия на эксплуатацию',
        desc: 'Взрывопожароопасные и химически опасные ОПО I–III класса',
        risk: 'critical',
        riskLabel: '🔴 Критический',
        rows: [
            { label: 'Штраф', value: 'до 500 000 ₽', cls: 'critical' },
            { label: 'Приостановка', value: 'до 90 суток', cls: 'critical' },
            { label: 'Уголовная', value: 'до 5 лет (ст. 171 УК РФ)', cls: 'high' }
        ],
        action: '1. Приостановить эксплуатацию ОПО до получения лицензии.<br>2. Подать заявление в Ростехнадзор.<br>3. Собрать пакет документов.'
    },
    {
        title: 'Декларация промышленной безопасности',
        desc: 'ОПО I–II класса опасности',
        risk: 'high',
        riskLabel: '🟡 Высокий',
        rows: [
            { label: 'Штраф', value: 'до 300 000 ₽', cls: 'high' },
            { label: 'Приостановка', value: 'до 90 суток', cls: 'high' },
            { label: 'Уголовная', value: 'Нет', cls: 'low' }
        ],
        action: '1. Заказать экспертизу ПБ.<br>2. Разработать или актуализировать декларацию.<br>3. Зарегистрировать в Ростехнадзоре.'
    },
    {
        title: 'Свидетельство о регистрации ОПО',
        desc: 'Внесение в госреестр ОПО',
        risk: 'high',
        riskLabel: '🟡 Высокий',
        rows: [
            { label: 'Штраф', value: 'до 200 000 ₽', cls: 'high' },
            { label: 'Приостановка', value: 'до 90 суток', cls: 'high' },
            { label: 'Уголовная', value: 'Нет', cls: 'low' }
        ],
        action: '1. Провести идентификацию ОПО.<br>2. Подать заявление в Ростехнадзор.<br>3. Получить свидетельство или выписку.'
    },
    {
        title: 'Паспорта на технические устройства',
        desc: 'Оборудование, сосуды под давлением, подъемные сооружения',
        risk: 'medium',
        riskLabel: '🟡 Средний',
        rows: [
            { label: 'Штраф', value: 'до 200 000 ₽', cls: 'medium' },
            { label: 'Приостановка', value: 'Нет', cls: 'low' },
            { label: 'Уголовная', value: 'Нет', cls: 'low' }
        ],
        action: '1. Запросить дубликат у завода-изготовителя.<br>2. При отказе — заказать экспертизу ПБ.<br>3. Оформить новый паспорт.'
    },
    {
        title: 'Проектная документация',
        desc: 'Строительство, реконструкция, техперевооружение',
        risk: 'medium',
        riskLabel: '🟡 Средний',
        rows: [
            { label: 'Штраф', value: 'до 200 000 ₽', cls: 'medium' },
            { label: 'Приостановка', value: 'Нет', cls: 'low' },
            { label: 'Уголовная', value: 'Нет', cls: 'low' }
        ],
        action: '1. Запросить копию у проектной организации.<br>2. Проверить архивы.<br>3. Если не найдено — разработать при техперевооружении.'
    },
    {
        title: 'Производственные инструкции',
        desc: 'Порядок безопасного ведения работ',
        risk: 'low',
        riskLabel: '🟢 Низкий',
        rows: [
            { label: 'Штраф', value: 'до 100 000 ₽', cls: 'low' },
            { label: 'Приостановка', value: 'Нет', cls: 'low' },
            { label: 'Уголовная', value: 'Нет', cls: 'low' }
        ],
        action: '1. Разработать инструкции самостоятельно.<br>2. Учесть требования ФНП.<br>3. Утвердить и ознакомить персонал.'
    },
    {
        title: 'Страховой полис ОПО',
        desc: 'Обязательное страхование ответственности',
        risk: 'none',
        riskLabel: '🔵 Минимальный',
        rows: [
            { label: 'Штраф', value: 'до 50 000 ₽', cls: 'none' },
            { label: 'Приостановка', value: 'Нет', cls: 'low' },
            { label: 'Уголовная', value: 'Нет', cls: 'low' }
        ],
        action: '1. Заключить договор страхования.<br>2. Получить полис на каждый ОПО.<br>3. Оформить за 1–2 дня.'
    }
];

// ================================================================
// СОСТОЯНИЕ
// ================================================================
let current = 0;
const track = document.getElementById('bookTrack');
const dotsEl = document.getElementById('dots');
const counterEl = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

// ================================================================
// РЕНДЕР
// ================================================================
function renderBook() {
    track.innerHTML = '';
    dotsEl.innerHTML = '';

    DOCS.forEach((doc, index) => {
        // Страница
        const page = document.createElement('div');
        page.className = 'page';

        let rowsHtml = '';
        doc.rows.forEach(r => {
            rowsHtml += `
                <div class="info-row">
                    <span class="label">${r.label}</span>
                    <span class="value ${r.cls}">${r.value}</span>
                </div>
            `;
        });

        page.innerHTML = `
            <div class="page-header">
                <div>
                    <div class="page-title">${doc.title}</div>
                    <div class="page-desc">${doc.desc}</div>
                </div>
                <span class="page-badge ${doc.risk}">${doc.riskLabel}</span>
            </div>
            ${rowsHtml}
            <div class="action-box">
                <strong>Что делать:</strong>
                ${doc.action}
            </div>
        `;
        track.appendChild(page);

        // Точка
        const dot = document.createElement('button');
        dot.className = 'dot' + (index === 0 ? ' active' : '');
        dot.addEventListener('click', () => goTo(index));
        dotsEl.appendChild(dot);
    });

    updateBook();
}

function updateBook() {
    track.style.transform = `translateX(-${current * 100}%)`;

    document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i === current);
    });

    counterEl.textContent = `${current + 1} / ${DOCS.length}`;

    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === DOCS.length - 1;
}

function goTo(index) {
    if (index < 0 || index >= DOCS.length) return;
    current = index;
    updateBook();
}

// ================================================================
// СОБЫТИЯ
// ================================================================
prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

// Свайпы
let touchStartX = 0;
track.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
}, { passive: true });
track.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) {
        if (diff > 0) goTo(current + 1);
        else goTo(current - 1);
    }
});

// Стрелки клавиатуры
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') goTo(current - 1);
    if (e.key === 'ArrowRight') goTo(current + 1);
});

// ================================================================
// СТАРТ
// ================================================================
renderBook();
</script>

</body>
</html>
