<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Что вы сделаете в этой ситуации?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #ffffff;
    color: #2c3e50;
    padding: 30px 20px;
    display: flex;
    justify-content: center;
  }

  .scene {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: 150px 1fr 150px;
    grid-template-rows: auto auto auto;
    gap: 20px 24px;
    align-items: start;
  }

  /* ===== Дмитрий — левый верх ===== */
  .dmitry {
    grid-column: 1;
    grid-row: 1;
    width: 150px;
    height: 180px;
    border-radius: 14px;
    background: #f1f5f9;
    border: 2px dashed #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    overflow: hidden;
  }
  .dmitry img { width: 100%; height: 100%; object-fit: contain; }

  /* ===== Речевое облако Дмитрия ===== */
  .dmitry-speech {
    grid-column: 2;
    grid-row: 1;
    position: relative;
    padding: 20px 24px;
    border: 2px solid #c7d0da;
    border-radius: 16px;
    background: #ffffff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }

  /* Хвостик облака к Дмитрию */
  .dmitry-speech::before {
    content: "";
    position: absolute;
    left: -16px;
    top: 30px;
    border-top: 12px solid transparent;
    border-bottom: 12px solid transparent;
    border-right: 16px solid #c7d0da;
  }
  .dmitry-speech::after {
    content: "";
    position: absolute;
    left: -12px;
    top: 32px;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-right: 14px solid #ffffff;
  }

  .speech-text {
    font-size: 15px;
    line-height: 1.5;
    color: #2c3e50;
    margin-bottom: 10px;
  }

  .speech-question {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.35;
    color: #1a5c9e;
    margin-top: 8px;
    padding-top: 10px;
    border-top: 2px dashed #c7d0da;
  }

  /* ===== Варианты ===== */
  .options {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    flex-direction: column;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 6px;
    border-bottom: 1px solid #dfe4ea;
    cursor: pointer;
    font-size: 15.5px;
    color: #2c3e50;
    transition: background 0.15s;
    position: relative;
  }
  .option:last-child { border-bottom: none; }
  .option:hover { background: #f8fafc; }

  .option input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .box {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border: 2px solid #c7d0da;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    transition: all 0.2s ease;
  }

  .option.checked .box {
    border-color: #1a7a4a;
    background: #f0fdf4;
  }
  .option.checked .box::after {
    content: "✔";
    color: #1a7a4a;
    font-size: 22px;
    font-weight: 700;
  }

  .option.wrong .box {
    border-color: #b91c1c;
    background: #fef2f2;
  }
  .option.wrong .box::after {
    content: "✘";
    color: #b91c1c;
    font-size: 22px;
    font-weight: 700;
  }

  .option .text { flex: 1; line-height: 1.4; }

  /* ===== Кнопка ===== */
  .check-btn {
    grid-column: 2;
    grid-row: 3;
    justify-self: center;
    background: #1a5c9e;
    color: #fff;
    border: none;
    border-radius: 40px;
    padding: 13px 40px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    font-family: inherit;
    margin-top: 10px;
  }
  .check-btn:hover:not(:disabled) {
    background: #12457a;
    transform: scale(1.02);
  }
  .check-btn:disabled {
    background: #c5d2e2;
    cursor: not-allowed;
    transform: none;
  }

  /* ===== Результат ===== */
  .result {
    grid-column: 2;
    grid-row: 4;
    padding: 16px 20px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.6;
    display: none;
    border-left: 5px solid #1a5c9e;
    margin-top: 10px;
  }
  .result.show { display: block; }
  .result.ok {
    background: #f0fdf4;
    border-left-color: #1a7a4a;
    color: #14532d;
  }
  .result.bad {
    background: #fef2f2;
    border-left-color: #b91c1c;
    color: #7f1d1d;
  }

  /* ===== Виталик — правый столбец ===== */
  .vitalik {
    grid-column: 3;
    grid-row: 1 / span 2;
    align-self: center;
    width: 150px;
    height: 180px;
    border-radius: 14px;
    background: #f1f5f9;
    border: 2px dashed #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    overflow: hidden;
  }
  .vitalik img { width: 100%; height: 100%; object-fit: contain; }

  /* ===== Мобильная ===== */
  @media (max-width: 780px) {
    .scene {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
      gap: 16px;
    }
    .dmitry,
    .dmitry-speech,
    .options,
    .check-btn,
    .result,
    .vitalik {
      grid-column: 1;
      grid-row: auto;
    }
    .dmitry, .vitalik {
      justify-self: center;
      width: 130px;
      height: 160px;
    }
    .dmitry-speech::before,
    .dmitry-speech::after { display: none; }
    .speech-question { font-size: 16px; }
    .option { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="scene">

  <!-- ДМИТРИЙ — левый верх -->
  <div class="dmitry">
    <img src="dmitry.png" alt="Дмитрий"
         onerror="this.style.display='none'; this.parentNode.textContent='Дмитрий';">
  </div>

  <!-- РЕЧЕВОЕ ОБЛАКО ДМИТРИЯ (задаёт вопрос) -->
  <div class="dmitry-speech">
    <div class="speech-text">
      В организации отсутствуют свидетельство о регистрации ОПО и сведения, характеризующие ОПО
    </div>
    <div class="speech-question">
      Что вы сделаете в этой ситуации?
    </div>
  </div>

  <!-- ВИТАЛИК — правый столбец, на уровне облака и вариантов -->
  <div class="vitalik">
    <img src="vitalik.png" alt="Виталик"
         onerror="this.style.display='none'; this.parentNode.textContent='Виталик';">
  </div>

  <!-- ВАРИАНТЫ -->
  <div class="options" id="options">

    <label class="option" data-correct="false">
      <input type="checkbox" name="answer" value="A">
      <span class="box"></span>
      <span class="text">Не скажу никому до прихода инспектора</span>
    </label>

    <label class="option" data-correct="true">
      <input type="checkbox" name="answer" value="B">
      <span class="box"></span>
      <span class="text">Организую в срочном порядке оформление недостающих документов</span>
    </label>

    <label class="option" data-correct="false">
      <input type="checkbox" name="answer" value="C">
      <span class="box"></span>
      <span class="text">Сообщу в территориальное управление Ростехнадзора</span>
    </label>

  </div>

  <!-- КНОПКА -->
  <button class="check-btn" id="checkBtn" disabled>Проверить</button>

  <!-- РЕЗУЛЬТАТ -->
  <div class="result" id="result"></div>

</div>

<script>
(function () {
  const options = document.querySelectorAll('.option');
  const checkBtn = document.getElementById('checkBtn');
  const result = document.getElementById('result');

  options.forEach(opt => {
    const cb = opt.querySelector('input[type="checkbox"]');
    cb.addEventListener('change', () => {
      opt.classList.toggle('checked', cb.checked);
      const anyChecked = [...document.querySelectorAll('input[name="answer"]')].some(c => c.checked);
      checkBtn.disabled = !anyChecked;
    });
  });

  checkBtn.addEventListener('click', () => {
    let correctCount = 0, wrongCount = 0;

    options.forEach(opt => {
      const cb = opt.querySelector('input[type="checkbox"]');
      const isCorrect = opt.dataset.correct === 'true';
      opt.classList.remove('wrong');

      if (cb.checked && isCorrect) correctCount++;
      else if (cb.checked && !isCorrect) { wrongCount++; opt.classList.add('wrong'); }
    });

    const totalCorrect = [...options].filter(o => o.dataset.correct === 'true').length;

    if (correctCount === totalCorrect && wrongCount === 0) {
      result.className = 'result show ok';
      result.innerHTML = '<strong>✅ Верно!</strong> Нужно срочно организовать оформление недостающих документов: свидетельства о регистрации ОПО и сведений, характеризующих ОПО.';
    } else {
      result.className = 'result show bad';
      result.innerHTML = '<strong>❌ Не совсем так.</strong> Правильный вариант — «Организую в срочном порядке оформление недостающих документов». Скрывать проблему или сразу сообщать в Ростехнадзор — неверная тактика.';
    }

    options.forEach(opt => {
      opt.querySelector('input').disabled = true;
      opt.style.cursor = 'default';
    });
    checkBtn.disabled = true;
    checkBtn.textContent = 'Проверено';
  });
})();
</script>

</body>
</html>
