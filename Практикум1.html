<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Что вы сделаете в этой ситуации?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #ffffff;
    color: #2c3e50;
    padding: 24px 16px;
    display: flex;
    justify-content: center;
  }

  .scene {
    width: 100%;
    max-width: 760px;
  }

  /* ===== Верхний блок: Дмитрий + облако ===== */
  .top-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 22px;
  }

  /* Дмитрий — компактный */
  .dmitry {
    width: 90px;
    height: 110px;
    flex-shrink: 0;
    border-radius: 12px;
    background: #f1f5f9;
    border: 2px dashed #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    overflow: hidden;
  }
  .dmitry img { width: 100%; height: 100%; object-fit: contain; }

  /* Облако Дмитрия */
  .dmitry-speech {
    position: relative;
    flex: 1;
    padding: 16px 20px;
    border: 2px solid #c7d0da;
    border-radius: 16px;
    background: #ffffff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }

  /* Хвостик облака к Дмитрию */
  .dmitry-speech::before {
    content: "";
    position: absolute;
    left: -14px;
    top: 24px;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-right: 14px solid #c7d0da;
  }
  .dmitry-speech::after {
    content: "";
    position: absolute;
    left: -10px;
    top: 26px;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-right: 12px solid #ffffff;
  }

  .speech-text {
    font-size: 14.5px;
    line-height: 1.5;
    color: #2c3e50;
    margin-bottom: 10px;
  }

  .speech-question {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.35;
    color: #1a5c9e;
    margin-top: 8px;
    padding-top: 10px;
    border-top: 2px dashed #c7d0da;
  }

  /* ===== Основной блок: варианты + Виталик справа ===== */
  .main-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  .content {
    flex: 1;
    min-width: 0;
  }

  /* ===== Варианты ===== */
  .options {
    display: flex;
    flex-direction: column;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid #dfe4ea;
    cursor: pointer;
    font-size: 15px;
    color: #2c3e50;
    transition: background 0.15s;
    position: relative;
  }
  .option:last-child { border-bottom: none; }
  .option:hover { background: #f8fafc; }

  .option input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .box {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border: 2px solid #c7d0da;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    transition: all 0.2s ease;
  }

  .option.checked .box {
    border-color: #1a7a4a;
    background: #f0fdf4;
  }
  .option.checked .box::after {
    content: "✔";
    color: #1a7a4a;
    font-size: 20px;
    font-weight: 700;
  }

  .option.wrong .box {
    border-color: #b91c1c;
    background: #fef2f2;
  }
  .option.wrong .box::after {
    content: "✘";
    color: #b91c1c;
    font-size: 20px;
    font-weight: 700;
  }

  .option .text { flex: 1; line-height: 1.4; }

  /* ===== Кнопка ===== */
  .check-btn {
    display: block;
    margin: 22px auto 0;
    background: #1a5c9e;
    color: #fff;
    border: none;
    border-radius: 40px;
    padding: 12px 36px;
    font-size: 15.5px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    font-family: inherit;
  }
  .check-btn:hover:not(:disabled) {
    background: #12457a;
    transform: scale(1.02);
  }
  .check-btn:disabled {
    background: #c5d2e2;
    cursor: not-allowed;
    transform: none;
  }

  /* ===== Результат ===== */
  .result {
    margin-top: 18px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
    border-left: 5px solid #1a5c9e;
  }
  .result.show { display: block; }
  .result.ok {
    background: #f0fdf4;
    border-left-color: #1a7a4a;
    color: #14532d;
  }
  .result.bad {
    background: #fef2f2;
    border-left-color: #b91c1c;
    color: #7f1d1d;
  }

  /* ===== Виталик — справа, компактный ===== */
  .vitalik {
    width: 90px;
    height: 110px;
    flex-shrink: 0;
    border-radius: 12px;
    background: #f1f5f9;
    border: 2px dashed #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    overflow: hidden;
  }
  .vitalik img { width: 100%; height: 100%; object-fit: contain; }

  /* ===== Мобильная ===== */
  @media (max-width: 640px) {
    .top-row { flex-direction: column; align-items: center; text-align: center; }
    .dmitry-speech::before,
    .dmitry-speech::after { display: none; }
    .main-row { flex-direction: column; align-items: center; }
    .content { width: 100%; }
    .vitalik { align-self: center; }
    .speech-question { font-size: 15px; }
    .option { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="scene">

  <!-- ВЕРХНИЙ БЛОК: Дмитрий + облако -->
  <div class="top-row">

    <!-- Дмитрий -->
    <div class="dmitry">
      <img src="dmitry.png" alt="Дмитрий"
           onerror="this.style.display='none'; this.parentNode.textContent='Дмитрий';">
    </div>

    <!-- Облако Дмитрия с вопросом -->
    <div class="dmitry-speech">
      <div class="speech-text">
        В организации отсутствуют свидетельство о регистрации ОПО и сведения, характеризующие ОПО
      </div>
      <div class="speech-question">
        Что вы сделаете в этой ситуации?
      </div>
    </div>

  </div>

  <!-- ОСНОВНОЙ БЛОК: варианты + Виталик -->
  <div class="main-row">

    <div class="content">

      <!-- ВАРИАНТЫ -->
      <div class="options" id="options">

        <label class="option" data-correct="false">
          <input type="checkbox" name="answer" value="A">
          <span class="box"></span>
          <span class="text">Не скажу никому до прихода инспектора</span>
        </label>

        <label class="option" data-correct="true">
          <input type="checkbox" name="answer" value="B">
          <span class="box"></span>
          <span class="text">Организую в срочном порядке оформление недостающих документов</span>
        </label>

        <label class="option" data-correct="false">
          <input type="checkbox" name="answer" value="C">
          <span class="box"></span>
          <span class="text">Сообщу в территориальное управление Ростехнадзора</span>
        </label>

      </div>

      <!-- КНОПКА -->
      <button class="check-btn" id="checkBtn" disabled>Проверить</button>

      <!-- РЕЗУЛЬТАТ -->
      <div class="result" id="result"></div>

    </div>

    <!-- Виталик -->
    <div class="vitalik">
      <img src="vitalik.png" alt="Виталик"
           onerror="this.style.display='none'; this.parentNode.textContent='Виталик';">
    </div>

  </div>

</div>

<script>
(function () {
  const options = document.querySelectorAll('.option');
  const checkBtn = document.getElementById('checkBtn');
  const result = document.getElementById('result');

  options.forEach(opt => {
    const cb = opt.querySelector('input[type="checkbox"]');
    cb.addEventListener('change', () => {
      opt.classList.toggle('checked', cb.checked);
      const anyChecked = [...document.querySelectorAll('input[name="answer"]')].some(c => c.checked);
      checkBtn.disabled = !anyChecked;
    });
  });

  checkBtn.addEventListener('click', () => {
    let correctCount = 0, wrongCount = 0;

    options.forEach(opt => {
      const cb = opt.querySelector('input[type="checkbox"]');
      const isCorrect = opt.dataset.correct === 'true';
      opt.classList.remove('wrong');

      if (cb.checked && isCorrect) correctCount++;
      else if (cb.checked && !isCorrect) { wrongCount++; opt.classList.add('wrong'); }
    });

    const totalCorrect = [...options].filter(o => o.dataset.correct === 'true').length;

    if (correctCount === totalCorrect && wrongCount === 0) {
      result.className = 'result show ok';
      result.innerHTML = '<strong>✅ Верно!</strong> Нужно срочно организовать оформление недостающих документов: свидетельства о регистрации ОПО и сведений, характеризующих ОПО.';
    } else {
      result.className = 'result show bad';
      result.innerHTML = '<strong>❌ Не совсем так.</strong> Правильный вариант — «Организую в срочном порядке оформление недостающих документов». Скрывать проблему или сразу сообщать в Ростехнадзор — неверная тактика.';
    }

    options.forEach(opt => {
      opt.querySelector('input').disabled = true;
      opt.style.cursor = 'default';
    });
    checkBtn.disabled = true;
    checkBtn.textContent = 'Проверено';
  });
})();
</script>

</body>
</html>
