<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Флипчарт: Документы и аудит</title>
    <style>
        :root {
            --primary: #004080;
            --primary-hover: #003366;
            --bg-light: #f4f8fd;
            --border-color: #004080; 
            --text: #333;
            --text-muted: #666;
            --danger: #d32f2f;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Сетка карточек 2x2 (КВАДРАТ) */
        .flipchart-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 600px; /* Размер квадрата */
        }

        /* Маленькая карточка-плитка */
        .card-tile {
            background-color: var(--bg-light);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            height: 180px; /* Компактная высота */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 64, 128, 0.05);
            box-sizing: border-box;
        }

        .card-tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 64, 128, 0.15);
            background-color: #e6f0fa;
        }

        .card-tile .number {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            opacity: 0.2;
            margin-bottom: 10px;
            line-height: 1;
        }

        .card-tile h2 {
            font-size: 16px;
            color: var(--primary);
            margin: 0;
            font-weight: 700;
            line-height: 1.3;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 20, 40, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Вываливающаяся карточка */
        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            transform: translateY(40px) scale(0.9);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            background-color: var(--bg-light);
            padding: 15px 20px;
            border-bottom: 1px solid #dce4ed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--primary);
            font-weight: 700;
        }

        .btn-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: color 0.2s;
        }

        .btn-close:hover { color: var(--danger); }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
        }

        .modal-body p {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .modal-body ul {
            padding-left: 20px;
            margin-top: 0;
            margin-bottom: 12px;
        }

        .modal-body li {
            margin-bottom: 6px;
        }

        /* Адаптив для телефонов */
        @media (max-width: 500px) {
            .flipchart-grid { 
                grid-template-columns: 1fr; /* На телефоне в один столбик */
                max-width: 300px;
            }
            .card-tile { height: 140px; }
        }
    </style>
</head>
<body>

<div class="flipchart-grid">
    
    <!-- Плитки (Квадрат 2x2) -->
    <div class="card-tile" onclick="openModal(0)">
        <div class="number">01</div>
        <h2>Порядок в документах</h2>
    </div>

    <div class="card-tile" onclick="openModal(1)">
        <div class="number">02</div>
        <h2>Хранение и поиск</h2>
    </div>

    <div class="card-tile" onclick="openModal(2)">
        <div class="number">03</div>
        <h2>Мобильный аудит</h2>
    </div>

    <div class="card-tile" onclick="openModal(3)">
        <div class="number">04</div>
        <h2>Контроль предписаний</h2>
    </div>

</div>

<!-- Модальное окно -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2 id="modalTitle">Заголовок</h2>
            <button class="btn-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- Текст вставляется через JS -->
        </div>
    </div>
</div>

<script>
    // Тексты для карточек
    const contents = [
        // 1
        `<p>У каждого документа есть автор, маршрут согласования, дата утверждения, срок действия и ответственный за пересмотр.</p>
         <p>Когда выходит новая редакция, старая уходит в архив, но остается доступной для истории. Специалист в любой момент видит, какая редакция действует сейчас, кто её утвердил и что именно изменилось.</p>
         <p>А если меняются требования или выходит предписание надзорного органа, система сама создает задачу на актуализацию.</p>`,
        
        // 2
        `<p>Чтобы поиск действительно работал, нужны единое место хранения, логичная структура, единые правила наименования и привязка документа к объекту или процессу.</p>
         <p>Иначе даже электронное хранилище превратится в набор папок, в которых невозможно ничего найти.</p>
         <p>Плюс обязательно разграничение доступа: каждый работник видит только то, что ему положено.</p>`,

        // 3
        `<p>Чек-листы по типам объектов — «Сосуды под давлением», «Грузоподъемные механизмы», «Газовое хозяйство» — загружаются в систему один раз.</p>
         <p>Дальше вы выходите на объект со смартфоном, выбираете нужный объект и видите список вопросов. Нашли нарушение — нажали «Несоответствие», сделали фото (оно автоматически привязывается к нарушению), при желании надиктовали описание голосом.</p>
         <p>По завершении система сама собирает всё в акт производственного контроля — без Word и ручной вставки картинок.</p>`,

        // 4
        `<p>Самое важное начинается после кнопки «Отправить». Предписание встает на контроль и проходит через статусы:</p>
         <ul>
            <li><b>«Выдано»</b> — начальник цеха получил задачу;</li>
            <li><b>«В работе»</b> — система отсчитывает дни до дедлайна;</li>
            <li><b>«На проверке»</b> — исполнитель обязан прикрепить фото «после» или скан акта;</li>
            <li><b>«Устранено»</b> или <b>«На доработке»</b> — вы одобряете результат или возвращаете на исправление.</li>
         </ul>
         <p>Закрыть задачу просто так не получится: система не позволит перевести статус, пока не загружен фотоотчет. А если дедлайн просрочен хотя бы на день, задача становится красной, и уведомление уходит на уровень выше — главному инженеру или директору по производству.</p>`
    ];

    const titles = [
        "Порядок в документах",
        "Хранение и поиск",
        "Мобильный аудит на объекте",
        "Контроль предписаний"
    ];

    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');

    // Открытие модалки
    function openModal(index) {
        modalTitle.innerText = titles[index];
        modalBody.innerHTML = contents[index];
        
        modal.classList.add('active');
        document.body.style.overflow = 'hidden'; 
    }

    // Закрытие модалки
    function closeModal(e) {
        if (!e || e.target === modal) {
            modal.classList.remove('active');
            document.body.style.overflow = ''; 
        }
    }
</script>

</body>
</html>
