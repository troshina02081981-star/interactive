<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта процессов ПБ</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:10px;background:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2937;line-height:1.3}
  .widget{max-width:720px;margin:0 auto;background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:10px 12px}
  .widget h1{font-size:14px;margin:0 0 2px}
  .lead{color:#6b7280;font-size:11px;margin:0 0 8px}
  .flow{display:flex;align-items:center;overflow-x:auto;gap:0}
  .stage{flex:1 0 120px;min-width:120px;display:flex;flex-direction:column;gap:4px}
  .stage-title{font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;color:#6b7280;font-weight:700;text-align:center;margin-bottom:1px}
  .block{border:1px solid #e5e7eb;border-radius:6px;padding:5px 7px;cursor:pointer;font-size:11.5px;transition:.12s;user-select:none;background:#fff;text-align:center}
  .block:hover{border-color:#2563eb;background:#f8fafc}
  .block.sel{border-color:#2563eb;background:#eff6ff}
  .arrow{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:#2563eb;font-size:15px;font-weight:700}
  .info{margin-top:8px;padding:6px 8px;border-radius:6px;background:#fff;border:1px solid #e5e7eb;font-size:11.5px;min-height:34px}
  .info strong{color:#2563eb}
  .info .auto{color:#374151}
  @media(max-width:600px){
    .flow{flex-direction:column}
    .arrow{transform:rotate(90deg);height:18px}
    .stage{min-width:0}
  }
</style>
</head>
<body>
<div class="widget">
  <h1>Карта процессов: данные → решение</h1>
  <p class="lead">Кликните по блоку — внизу появится описание и что даёт автоматизация.</p>

  <div class="flow" id="flow"></div>

  <div class="info" id="info">Выберите блок.</div>
</div>

<script>
const STAGES = [
  { title:"Входы", blocks:[
    { name:"Журналы", desc:"Инструктажи, обходы, дефекты, СИЗ, обучение.", auto:"Мобильные чек-листы с фото: записи не теряются, замечание сразу становится задачей." },
    { name:"Наряды-допуски", desc:"Допуск подрядчиков и ремонтных работ.", auto:"Электронные наряды с проверкой условий и обученности — без бумажных согласований." },
    { name:"Оборудование", desc:"Паспорта, история ремонтов, поверки, дефекты.", auto:"Карточка оборудования связана с документами, проверками и отчётами — одна точка правды." },
    { name:"Внешние сигналы", desc:"Почта, СЭД, предписания, заявки служб.", auto:"Письмо или предписание сразу становится задачей с объектом и сроком." }
  ]},
  { title:"Специалист по ПБ", blocks:[
    { name:"Обходы", desc:"Осмотр объекта и фиксация нарушений.", auto:"Чек-листы, фото, автосоздание замечаний и задач с исполнителем и сроком." },
    { name:"Сроки", desc:"Предписания, мероприятия, экспертизы, аттестации, поверки.", auto:"Напоминания, эскалации, дашборд просрочек — сроки не в голове." },
    { name:"Инциденты", desc:"Фиксация, расследование, корректирующие мероприятия.", auto:"Цепочка фиксация → задача → меры → закрытие, с аналитикой причин." },
    { name:"Документы", desc:"Инструкции, паспорта, заключения, СИЗ, обученность.", auto:"Реестр документов привязан к объектам и ролям, версии актуальны." },
    { name:"Коммуникация", desc:"Цеха, подрядчики, ремонтные и технические службы.", auto:"Задачи по ролям и зонам ответственности, статус виден всем." }
  ]},
  { title:"Выходы", blocks:[
    { name:"Отчёты", desc:"Внутренние, Ростехнадзор, Роструд, статистика.", auto:"Автосбор из связанных данных — без ручной сборки." },
    { name:"Закрытые замечания", desc:"Подтверждённое устранение нарушений.", auto:"Закрытие с фото и историей — формальных закрытий меньше." },
    { name:"Готовность к проверке", desc:"Полный комплект достоверных данных.", auto:"Онлайн-картина и след: инспектор видит реальную работу системы." },
    { name:"Управление рисками", desc:"Решения на основе данных, а не постфактум.", auto:"Аналитика и цифровой двойник — риск виден до инцидента." }
  ]}
];

const flow = document.getElementById("flow");
const info = document.getElementById("info");

STAGES.forEach((stage, si) => {
  const col = document.createElement("div");
  col.className = "stage";

  const t = document.createElement("div");
  t.className = "stage-title";
  t.textContent = stage.title;
  col.appendChild(t);

  stage.blocks.forEach(b => {
    const el = document.createElement("div");
    el.className = "block";
    el.textContent = b.name;
    el.addEventListener("click", () => {
      document.querySelectorAll(".block").forEach(x => x.classList.remove("sel"));
      el.classList.add("sel");
      info.innerHTML = `<strong>${b.name}.</strong> ${b.desc} <span class="auto"><strong>Авто:</strong> ${b.auto}</span>`;
    });
    col.appendChild(el);
  });

  flow.appendChild(col);

  if (si < STAGES.length - 1) {
    const a = document.createElement("div");
    a.className = "arrow";
    a.textContent = "→";
    flow.appendChild(a);
  }
});
</script>
</body>
</html>
