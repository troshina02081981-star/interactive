<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Признаки опасности ОПО</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #ffffff;
    margin: 0;
    padding: 10px;
    color: #3a4a5a;
  }

  .pie-wrapper {
    position: relative;
    width: 480px;
    height: 480px;
    margin: 0 auto;
  }

  svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .slice {
    cursor: pointer;
    transition: transform 0.4s ease, filter 0.25s;
    transform-origin: 240px 240px;
  }

  .slice:hover {
    filter: brightness(1.05);
  }

  .slice text {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 11px;
    font-weight: 600;
    fill: #2c3e50;
    text-anchor: middle;
    pointer-events: none;
  }

  .slice .icon {
    font-size: 17px;
    text-anchor: middle;
    pointer-events: none;
  }

  .center-circle {
    fill: #ffffff;
    stroke: #b9d7f0;
    stroke-width: 2;
    filter: drop-shadow(0 2px 8px rgba(74, 144, 217, 0.12));
  }

  .center-text {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 15px;
    font-weight: 700;
    fill: #2c6bb5;
    text-anchor: middle;
  }

  .center-sub {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 9.5px;
    fill: #6b8bab;
    text-anchor: middle;
  }

  .pie-tooltip {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    width: 200px;
    background: #ffffff;
    border: 1px solid #d8e6f5;
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 8px 24px rgba(44, 107, 181, 0.18);
    font-size: 11.5px;
    line-height: 1.45;
    color: #4a5568;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    text-align: center;
  }

  .pie-tooltip.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }

  .pie-tooltip .tt-title {
    font-weight: 600;
    font-size: 13px;
    color: #2c3e50;
    margin-bottom: 4px;
  }

  .pie-tooltip .tt-close {
    margin-top: 8px;
    font-size: 10.5px;
    color: #9bb3c9;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="pie-wrapper">

  <svg viewBox="0 0 480 480">
    <g id="slicesGroup">

      <!-- Сектор 0: 0°–60° -->
      <g class="slice" data-index="0" data-angle="30">
        <path d="M 240 240 L 240 30 A 210 210 0 0 1 421.9 135 Z"
              fill="#eaf3fc" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
        <text class="icon" x="300" y="128">⚗️</text>
        <text x="300" y="148">Опасные</text>
        <text x="300" y="162">вещества</text>
      </g>

      <!-- Сектор 1: 60°–120° -->
      <g class="slice" data-index="1" data-angle="90">
        <path d="M 240 240 L 421.9 135 A 210 210 0 0 1 421.9 345 Z"
              fill="#e6f4ec" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
        <text class="icon" x="368" y="218">🔧</text>
        <text x="368" y="238">Оборудование</text>
        <text x="368" y="252">под давлением</text>
      </g>

      <!-- Сектор 2: 120°–180° -->
      <g class="slice" data-index="2" data-angle="150">
        <path d="M 240 240 L 421.9 345 A 210 210 0 0 1 240 450 Z"
              fill="#fdf2e6" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
        <text class="icon" x="300" y="330">🏗️</text>
        <text x="300" y="350">Подъемные</text>
        <text x="300" y="364">сооружения</text>
      </g>

      <!-- Сектор 3: 180°–240° -->
      <g class="slice" data-index="3" data-angle="210">
        <path d="M 240 240 L 240 450 A 210 210 0 0 1 58.1 345 Z"
              fill="#f3ecfa" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
        <text class="icon" x="180" y="330">⛏️</text>
        <text x="180" y="350">Горные</text>
        <text x="180" y="364">работы</text>
      </g>

      <!-- Сектор 4: 240°–300° -->
      <g class="slice" data-index="4" data-angle="270">
        <path d="M 240 240 L 58.1 345 A 210 210 0 0 1 58.1 135 Z"
              fill="#fdecec" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
        <text class="icon" x="112" y="218">🔥</text>
        <text x="112" y="238">Расплавы</text>
        <text x="112" y="252">металлов</text>
      </g>

      <!-- Сектор 5: 300°–360° -->
      <g class="slice" data-index="5" data-angle="330">
        <path d="M 240 240 L 58.1 135 A 210 210 0 0 1 240 30 Z"
              fill="#e8f6f8" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
        <text class="icon" x="180" y="128">🌾</text>
        <text x="180" y="148">Растительное</text>
        <text x="180" y="162">сырье</text>
      </g>

    </g>

    <!-- Центр -->
    <circle class="center-circle" cx="240" cy="240" r="58"/>
    <text class="center-text" x="240" y="236">116-ФЗ</text>
    <text class="center-sub" x="240" y="254">Признаки</text>
    <text class="center-sub" x="240" y="267">опасности ОПО</text>
  </svg>

  <div class="pie-tooltip" id="tooltip">
    <div class="tt-title" id="ttTitle"></div>
    <div id="ttBody"></div>
    <div class="tt-close" id="ttClose">закрыть</div>
  </div>

</div>

<script>
  const texts = {
    0: "Токсичные, взрывчатые, горючие и другие вещества, способные навредить людям и окружающей среде.",
    1: "Сосуды, котлы, трубопроводы пара и горячей воды, работающие под избыточным давлением.",
    2: "Краны, лифты, канатные дороги, эскалаторы и другие грузоподъемные механизмы.",
    3: "Добыча полезных ископаемых, строительство подземных сооружений, буровые работы.",
    4: "Процессы плавки, литья и обработки расплавленных металлов и сплавов.",
    5: "Зерно, мука, сахар и другое сырье, способное к самовозгоранию или образованию взрывоопасной пыли."
  };

  const titles = {
    0: "Опасные вещества",
    1: "Оборудование под давлением",
    2: "Подъемные сооружения",
    3: "Горные работы",
    4: "Расплавы металлов",
    5: "Растительное сырье"
  };

  const slices = document.querySelectorAll('.slice');
  const tooltip = document.getElementById('tooltip');
  const ttTitle = document.getElementById('ttTitle');
  const ttBody = document.getElementById('ttBody');
  const ttClose = document.getElementById('ttClose');

  slices.forEach(slice => {
    const angle = parseFloat(slice.dataset.angle);
    const index = slice.dataset.index;

    slice.addEventListener('click', () => {
      slices.forEach(s => {
        s.style.transform = 'translate(0, 0)';
      });

      const rad = (angle - 90) * Math.PI / 180;
      const dx = Math.cos(rad) * 14;
      const dy = Math.sin(rad) * 14;
      slice.style.transform = `translate(${dx}px, ${dy}px)`;

      ttTitle.textContent = titles[index];
      ttBody.textContent = texts[index];
      tooltip.classList.add('visible');
    });
  });

  ttClose.addEventListener('click', () => {
    tooltip.classList.remove('visible');
    slices.forEach(s => {
      s.style.transform = 'translate(0, 0)';
    });
  });
</script>

</body>
</html>
