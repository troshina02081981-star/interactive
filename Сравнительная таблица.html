<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ручной vs Автоматизированный контроль ПБ</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --text: #1a2233;
    --muted: #5b6779;
    --line: #dfe4ec;
    --manual: #d9534f;
    --auto: #2e9e6b;
    --manual-bg: #fdf3f2;
    --auto-bg: #eef9f3;
    --accent: #2f6fed;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 18px 14px;
  }

  header {
    margin-bottom: 14px;
  }

  h1 {
    font-size: 1.05rem;
    margin: 0 0 4px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.8rem;
    margin: 0;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
    align-items: center;
  }

  .toggle-btn {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    padding: 5px 11px;
    border-radius: 6px;
    font-size: 0.76rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .toggle-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 170px;
  }

  .search-wrap input {
    width: 100%;
    padding: 6px 10px 6px 30px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #fff;
    font-size: 0.76rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(47, 111, 237, 0.12);
  }

  .search-wrap svg {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    width: 13px;
    height: 13px;
    stroke: var(--muted);
    pointer-events: none;
  }

  .table-card {
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }

  thead th {
    text-align: left;
    padding: 8px 11px;
    font-weight: 600;
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    background: #f4f6fa;
    color: var(--text);
    border-bottom: 1px solid var(--line);
  }

  thead th.col-manual { color: var(--manual); }
  thead th.col-auto   { color: var(--auto); }

  tbody td {
    padding: 7px 11px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
    transition: background 0.15s ease;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fafbfe; }

  td.criterion {
    font-weight: 600;
    width: 22%;
  }

  td.manual {
    background: var(--manual-bg);
    color: #6e2523;
    width: 39%;
  }

  td.auto {
    background: var(--auto-bg);
    color: #175c3d;
    width: 39%;
  }

  tbody tr:hover td.manual { background: #fbe6e4; }
  tbody tr:hover td.auto   { background: #e0f4e9; }

  body.hide-manual td.manual,
  body.hide-manual th.col-manual { display: none; }

  body.hide-auto td.auto,
  body.hide-auto th.col-auto { display: none; }

  body.hide-manual td.auto,
  body.hide-auto td.manual { width: 78%; }

  .badge {
    display: inline-block;
    font-size: 0.62rem;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    margin-right: 5px;
    vertical-align: middle;
    letter-spacing: 0.03em;
  }

  .badge-manual { background: var(--manual); color: #fff; }
  .badge-auto   { background: var(--auto);   color: #fff; }

  .empty-state {
    text-align: center;
    padding: 18px 12px;
    color: var(--muted);
    font-size: 0.8rem;
    display: none;
  }

  footer {
    margin-top: 10px;
    text-align: center;
    color: var(--muted);
    font-size: 0.7rem;
  }

  @media (max-width: 620px) {
    thead th, tbody td { padding: 6px 8px; }
    td.criterion { width: 28%; }
    td.manual, td.auto { width: 36%; }
    .container { padding: 12px; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Ручной и автоматизированный контроль</h1>
      <p class="subtitle">Ключевые различия по семи критериям</p>
    </header>

    <div class="controls">
      <button class="toggle-btn active" data-mode="all">Всё</button>
      <button class="toggle-btn" data-mode="manual">Ручной</button>
      <button class="toggle-btn" data-mode="auto">Автоматизированный</button>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="searchInput" type="text" placeholder="Поиск…" autocomplete="off" />
      </div>
    </div>

    <div class="table-card">
      <table id="compareTable">
        <thead>
          <tr>
            <th>Критерий</th>
            <th class="col-manual">Ручной</th>
            <th class="col-auto">Автоматизированный</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState">Ничего не найдено.</div>
    </div>

    <footer>Переключайте режимы и ищите по содержанию</footer>
  </div>

  <script>
    const data = [
      { criterion: "Сбор данных", manual: "Разрозненные журналы, Excel-таблицы.", auto: "Единая база данных в реальном времени." },
      { criterion: "Контроль сроков", manual: "Ручное отслеживание, высокий риск просрочек.", auto: "Автоуведомления за 90, 60 и 30 дней." },
      { criterion: "Анализ рисков", manual: "Реактивный — после инцидентов.", auto: "Предиктивный — прогнозирование инцидентов." },
      { criterion: "Отчётность", manual: "2–3 дня на подготовку к проверке.", auto: "Мгновенное формирование отчётов." },
      { criterion: "Интеграция", manual: "Изолированные системы.", auto: "Единое пространство: ERP, ЗУП, ТОИР и др." },
      { criterion: "Ошибки", manual: "Человеческий фактор: потери, ошибки переноса, несвоевременность.", auto: "Стандартизированный процесс и ЭДО исключают потери и оповещают об ошибках." },
      { criterion: "Масштабируемость", manual: "Ограничена ресурсами персонала.", auto: "Лёгкое масштабирование без потери качества." }
    ];

    const tbody = document.getElementById("tableBody");
    const searchInput = document.getElementById("searchInput");
    const emptyState = document.getElementById("emptyState");
    const buttons = document.querySelectorAll(".toggle-btn");
    let mode = "all";

    function render() {
      const q = searchInput.value.trim().toLowerCase();
      tbody.innerHTML = "";
      let visible = 0;

      data.forEach(row => {
        const haystack = `${row.criterion} ${row.manual} ${row.auto}`.toLowerCase();
        if (q && !haystack.includes(q)) return;
        visible++;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="criterion">${row.criterion}</td>
          <td class="manual"><span class="badge badge-manual">Р</span>${row.manual}</td>
          <td class="auto"><span class="badge badge-auto">А</span>${row.auto}</td>
        `;
        tbody.appendChild(tr);
      });

      emptyState.style.display = visible === 0 ? "block" : "none";
      document.body.classList.toggle("hide-manual", mode === "auto");
      document.body.classList.toggle("hide-auto", mode === "manual");
    }

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        mode = btn.dataset.mode;
        render();
      });
    });

    searchInput.addEventListener("input", render);
    render();
  </script>
</body>
</html>
