<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=560"><title>График проверок</title>
<style>
*{box-sizing:border-box;font:11px/1.3 system-ui,Arial;margin:0}
body{background:#fff;color:#1f2937;max-width:560px;margin:0 auto;padding:8px}
h1{font-size:13px;margin-bottom:6px;color:#111827}
.p{border:1px solid #e5e7eb;border-radius:6px;padding:6px 8px;margin-bottom:6px}
.head{display:flex;gap:3px;margin-bottom:4px}
.head .m{flex:1;text-align:center;font-size:8px;color:#9ca3af}
.row{display:flex;align-items:center;gap:3px;margin-bottom:3px}
.row .info{width:130px;flex:0 0 130px}
.row .name{font-size:10px;font-weight:600;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{display:flex;gap:2px;align-items:center;margin-top:1px}
.b{display:inline-block;padding:0 4px;border-radius:6px;font-size:8px;font-weight:600;color:#fff;line-height:12px}
.c1{background:#dc2626}.c2{background:#ea580c}.c3{background:#ca8a04}.c4{background:#2563eb}
.crit{display:flex;gap:1px}
.crit button{padding:0 3px;font-size:8px;border:1px solid #d1d5db;background:#fff;color:#6b7280;border-radius:2px;cursor:pointer;line-height:12px}
.crit button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.cells{flex:1;display:flex;gap:2px}
.cell{flex:1;aspect-ratio:1;border:1px solid #e5e7eb;border-radius:2px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;cursor:pointer}
.cell:hover{border-color:#2563eb}
.cell.К{background:#2563eb;border-color:#2563eb}
.cell.Т{background:#7c3aed;border-color:#7c3aed}
.cell.О{background:#0891b2;border-color:#0891b2}
.cell.В{background:#dc2626;border-color:#dc2626}
.freq{font-size:8px;color:#2563eb;font-weight:600}
.legend{display:flex;gap:8px;font-size:8px;color:#6b7280;margin-top:4px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:2px}
.legend i{width:8px;height:8px;border-radius:2px}
.sum{border-left:3px solid #2563eb;background:#eff6ff;padding:5px 7px;border-radius:3px;font-size:10px;margin-bottom:5px;line-height:1.5}
.sum b{color:#1e40af}
.warn{border-left:3px solid #d97706;background:#fffbeb;padding:3px 6px;border-radius:3px;font-size:9px;margin-bottom:3px}
.warn.bad{border-color:#dc2626;background:#fef2f2}
.warn.ok{border-color:#16a34a;background:#f0fdf4}
.warn b{display:block}
.btns{display:flex;gap:4px;margin-top:4px}
.btns button{flex:1;padding:3px;font-size:9px;border:1px solid #93c5fd;background:#fff;color:#2563eb;border-radius:3px;cursor:pointer}
.btns button:hover{background:#eff6ff}
</style></head><body>

<h1>График проверок на основе риска</h1>

<div class="p">
  <div class="head" id="months"></div>
  <div id="rows"></div>
  <div class="legend">
    <span><i style="background:#2563eb"></i>Комплексная</span>
    <span><i style="background:#7c3aed"></i>Тематическая</span>
    <span><i style="background:#0891b2"></i>Оперативная</span>
    <span><i style="background:#dc2626"></i>Внеплановая</span>
  </div>
</div>

<div class="p">
  <div class="sum" id="sum"></div>
  <div class="btns">
    <button onclick="addAll()">+ Внеплановая всем</button>
    <button onclick="clearExtra()">Сбросить внеплановые</button>
  </div>
</div>

<div class="p">
  <h3 style="font-size:10px;color:#6b7280;margin-bottom:4px">ПРОВЕРКА</h3>
  <div id="check"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const M=["Я","Ф","М","А","М","И","И","А","С","О","Н","Д"];
const NAMES={К:"Комплексная",Т:"Тематическая",О:"Оперативная",В:"Внеплановая"};

const OPOS=[
 {id:1,name:"Кран мостовой №3",class:3,crit:2,extra:{}},
 {id:2,name:"Резервуар Р-12",class:2,crit:3,extra:{}},
 {id:3,name:"ГРС-1",class:1,crit:3,extra:{}},
 {id:4,name:"Компрессор К-5",class:4,crit:1,extra:{}}
];

function freq(o){
  const base={1:1,2:2,3:3,4:6}[o.class];
  if(o.crit===3)return Math.max(1,Math.round(base/2));
  if(o.crit===1)return Math.min(12,base*2);
  return base;
}
function plan(o){
  const f=freq(o), res=[];
  const step=Math.max(1,Math.round(f/2));
  for(let m=0;m<12;m++){
    let k=null;
    if(m%f===0)k="К";
    else if(m%step===0)k="Т";
    else k="О";
    res.push({m,k});
  }
  // внеплановые: заменяют существующую или добавляются
  Object.keys(o.extra).forEach(m=>{
    if(o.extra[m]){const e=res.find(x=>x.m==+m); e.k="В"; e.extra=true;}
  });
  return res;
}

function renderMonths(){
  $("months").innerHTML=`<div style="width:130px;flex:0 0 130px"></div>`+
    M.map(m=>`<div class="m">${m}</div>`).join("");
}

function renderRows(){
  $("rows").innerHTML=OPOS.map(o=>{
    const p=plan(o), f=freq(o);
    const cells=p.map(x=>`<div class="cell ${x.k}" title="${NAMES[x.k]}" onclick="toggle(${o.id},${x.m})">${x.k}</div>`).join("");
    return `<div class="row">
      <div class="info">
        <div class="name" title="${o.name}">${o.name}</div>
        <div class="meta">
          <span class="b c${o.class}">${o.class}</span>
          <div class="crit">
            ${[1,2,3].map(c=>`<button class="${o.crit===c?'on':''}" onclick="setCrit(${o.id},${c})">${c}</button>`).join("")}
          </div>
          <span class="freq">/${f}м</span>
        </div>
      </div>
      <div class="cells">${cells}</div>
    </div>`;
  }).join("");
}
function setCrit(id,c){OPOS.find(o=>o.id===id).crit=c;renderAll()}
function toggle(id,m){
  const o=OPOS.find(x=>x.id===id);
  o.extra[m]=!o.extra[m];
  renderAll();
}
function addAll(){
  OPOS.forEach(o=>{if(!o.extra[5])o.extra[5]=true});
  renderAll();
}
function clearExtra(){OPOS.forEach(o=>o.extra={});renderAll()}

function renderSum(){
  const all=OPOS.flatMap(o=>plan(o));
  const c=k=>all.filter(x=>x.k===k).length;
  $("sum").innerHTML=`<b>Всего за год: ${all.length}</b> · К: ${c("К")} · Т: ${c("Т")} · О: ${c("О")} · В: ${c("В")}<br>
    <span style="color:#6b7280">Периодичность зависит от класса опасности и критичности (1–3). Клик по месяцу — добавить/убрать внеплановую.</span>`;
}

function renderCheck(){
  const e=[];
  OPOS.forEach(o=>{
    if(o.class<=2 && freq(o)>4)e.push({bad:1,t:`${o.name}: класс ${o.class}, периодичность ${freq(o)} мес. — редко`});
    if(o.crit===3 && !Object.values(o.extra).some(Boolean))e.push({t:`${o.name}: высокая критичность без резерва внеплановых`});
  });
  $("check").innerHTML=e.length
    ? e.map(x=>`<div class="warn ${x.bad?'bad':''}"><b>${x.bad?'⛔':'⚠'}</b>${x.t}</div>`).join("")
    : `<div class="warn ok"><b>✔ График сбалансирован</b>Периодичность соответствует риску, резерв внеплановых есть.</div>`;
}

function renderAll(){renderRows();renderSum();renderCheck()}
renderMonths();
renderAll();
</script></body></html>
