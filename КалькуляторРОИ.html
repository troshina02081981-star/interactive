<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор ROI внедрения автоматизации ПБ</title>
<style>
  *{box-sizing:border-box}
  html, body { margin: 0; padding: 0; background: #fff; height: auto !important; min-height: 0 !important; }
  body { padding: 8px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1f2937; line-height: 1.3; }
  .widget { max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid #d1d5db; border-radius: 10px; padding: 10px 12px; display: inline-block; width: 100%; }
  .widget h1 { font-size: 13px; margin: 0 0 3px; }
  .lead { color: #6b7280; font-size: 10.5px; margin: 0 0 10px; }

  .section { border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: #fff; }
  .section h2 { font-size: 9.5px; text-transform: uppercase; letter-spacing: .2px; color: #2563eb; font-weight: 700; margin: 0 0 6px; }
  
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .row label { flex: 1; font-size: 10.5px; color: #374151; }
  .row input { flex: 0 0 120px; border: 1px solid #d1d5db; border-radius: 6px; padding: 4px 6px; font-size: 10.5px; text-align: right; font-family: inherit; }
  .row input:focus { outline: none; border-color: #2563eb; }
  .row .unit { flex: 0 0 30px; font-size: 9.5px; color: #9ca3af; }

  .result { margin-top: 10px; border: 1px solid #bfdbfe; border-radius: 8px; background: #eff6ff; padding: 10px 12px; }
  .result .main { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .result .item { flex: 1 1 120px; }
  .result .item span { display: block; font-size: 9px; color: #6b7280; text-transform: uppercase; letter-spacing: .2px; margin-bottom: 2px; }
  .result .item b { font-size: 14px; color: #1d4ed8; font-weight: 700; }
  .result .verdict { padding-top: 8px; border-top: 1px dashed #bfdbfe; font-size: 10.5px; color: #1f2937; }
  .result .verdict strong { color: #1d4ed8; }
</style>
</head>
<body>
<div class="widget">
  <h1>Калькулятор ROI внедрения</h1>
  <p class="lead">Введите затраты и ожидаемую экономию — увидите полную стоимость, ROI и срок окупаемости.</p>

  <div class="section">
    <h2>Прямые затраты (руб.)</h2>
    <div class="row"><label>Лицензии</label><input type="number" id="license" value="300000"><div class="unit">руб.</div></div>
    <div class="row"><label>Внедрение (интеграция, настройка)</label><input type="number" id="impl" value="200000"><div class="unit">руб.</div></div>
    <div class="row"><label>Обучение</label><input type="number" id="train" value="50000"><div class="unit">руб.</div></div>
    <div class="row"><label>Поддержка за год</label><input type="number" id="support" value="80000"><div class="unit">руб.</div></div>
  </div>

  <div class="section">
    <h2>Внутренние затраты</h2>
    <div class="row"><label>Часы сотрудников на проект</label><input type="number" id="hours" value="150"><div class="unit">ч.</div></div>
    <div class="row"><label>Стоимость часа</label><input type="number" id="rate" value="800"><div class="unit">руб.</div></div>
  </div>

  <div class="section">
    <h2>Ожидаемая экономия (за год)</h2>
    <div class="row"><label>Экономия времени (рутина)</label><input type="number" id="saveTime" value="250000"><div class="unit">руб.</div></div>
    <div class="row"><label>Снижение штрафов и простоев</label><input type="number" id="saveRisk" value="150000"><div class="unit">руб.</div></div>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
const ids = ["license","impl","train","support","hours","rate","saveTime","saveRisk"];
const resEl = document.getElementById("result");

function money(n){ return Math.round(n).toLocaleString("ru-RU") + " руб."; }

function calc(){
  const license = +document.getElementById("license").value || 0;
  const impl = +document.getElementById("impl").value || 0;
  const train = +document.getElementById("train").value || 0;
  const support = +document.getElementById("support").value || 0;
  const hours = +document.getElementById("hours").value || 0;
  const rate = +document.getElementById("rate").value || 0;
  const saveTime = +document.getElementById("saveTime").value || 0;
  const saveRisk = +document.getElementById("saveRisk").value || 0;

  const internal = hours * rate;
  const direct = license + impl + train;
  
  // Затраты в первый год = прямые (без годовой поддержки) + внутренние + поддержка за год
  const totalYear1 = direct + internal + support;
  
  // Экономия за год
  const savings = saveTime + saveRisk;
  
  // Чистая экономия за первый год
  const netYear1 = savings - totalYear1;
  
  // ROI = (экономия - затраты) / затраты * 100%
  const roi = totalYear1 > 0 ? ((savings - totalYear1) / totalYear1) * 100 : 0;
  
  // Срок окупаемости в месяцах = затраты / (экономия / 12)
  const monthlySaving = savings / 12;
  const paybackMonths = monthlySaving > 0 ? totalYear1 / monthlySaving : 0;

  let verdict = "";
  let color = "#1d4ed8";
  if (paybackMonths <= 12) {
    verdict = `Окупается за <strong>${paybackMonths.toFixed(1)} мес.</strong> — сильный аргумент для руководства.`;
  } else if (paybackMonths <= 24) {
    verdict = `Окупается за <strong>${paybackMonths.toFixed(1)} мес.</strong> — приемлемый срок, но нужны дополнительные аргументы.`;
    color = "#d97706";
  } else {
    verdict = `Окупается за <strong>${paybackMonths.toFixed(1)} мес.</strong> — долго. Пересмотрите объем или начните с пилота.`;
    color = "#dc2626";
  }

  resEl.innerHTML = `
    <div class="main">
      <div class="item"><span>Полная стоимость (1-й год)</span><b>${money(totalYear1)}</b></div>
    </div>
    <div class="main">
      <div class="item"><span>Экономия за год</span><b style="color:#16a34a">${money(savings)}</b></div>
      <div class="item"><span>Чистый эффект</span><b style="color:${netYear1 >= 0 ? '#16a34a' : '#dc2626'}">${money(netYear1)}</b></div>
      <div class="item"><span>ROI</span><b>${roi.toFixed(0)}%</b></div>
    </div>
    <div class="verdict" style="color:${color}">${verdict}</div>
  `;
}

ids.forEach(id => document.getElementById(id).addEventListener("input", calc));
calc();
</script>
</body>
</html>
