<div style="font-family: Arial, sans-serif; max-width: 650px; margin: 0 auto; color: #2c5a7a;">

  <div style="font-size: 16px; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; color: #5b9bd5; text-align: center;">
    Проверка знаний
  </div>

  <div id="quiz-container" style="background: #ffffff; border: 2px solid #b6d4ea; border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(157, 195, 230, 0.2);">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <div id="q-num" style="font-size: 12px; font-weight: bold; color: #5b9bd5; text-transform: uppercase;">Вопрос 1 / 5</div>
    </div>

    <div id="q-text" style="font-size: 15px; font-weight: bold; margin-bottom: 12px; line-height: 1.3;">Текст вопроса</div>

    <div id="options-container" style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;">
      <!-- Кнопки -->
    </div>

    <div id="feedback-container" style="display: none; padding-top: 10px; border-top: 1px solid #e6f2ff;">
      <div id="feedback-text" style="font-size: 13px; line-height: 1.3; margin-bottom: 10px;"></div>
      <button id="btn-next" onclick="nextQuestion()" style="background: #5b9bd5; color: #ffffff; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; display: none; float: right;">Далее →</button>
      <div style="clear: both;"></div>
    </div>

  </div>
</div>

<script>
const quizData = [
  { question: "Из каких этапов состоит проверка готовности?", options: ["Только практика", "Документы и практика", "Теория и собеседование"], correct: 1, explanation: "Документарная оценка и практические испытания." },
  { question: "Что проверяют у организации на документарной оценке?", options: ["Только сварщиков", "Только НАКС", "Штат, документы, оборудование"], correct: 2, explanation: "Проверяют штат, техдокументацию, оборудование, материалы и оснастку." },
  { question: "Что делает сварщик на практике?", options: ["Тест на ПК", "Контрольное соединение", "Показывает НАКС"], correct: 1, explanation: "Выполняет контрольное сварное соединение заявленным способом." },
  { question: "Как фиксируются результаты испытаний?", options: ["На бумаге", "Не фиксируются", "Фото и видео"], correct: 2, explanation: "Фото- и видеофиксация в некорректируемом виде с привязкой к месту и времени." },
  { question: "Действуют ли старые документы НАКС?", options: ["Нет, менять", "До конца срока", "Только год"], correct: 1, explanation: "Старые документы действуют до истечения срока, указанного в них." }
];

let currentQ = 0;
let answered = false;

function renderQuestion() {
  answered = false;
  const q = quizData[currentQ];
  
  document.getElementById('q-num').textContent = `Вопрос ${currentQ + 1} / ${quizData.length}`;
  document.getElementById('q-text').textContent = q.question;
  document.getElementById('feedback-container').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
  
  const container = document.getElementById('options-container');
  container.innerHTML = '';
  
  q.options.forEach((opt, index) => {
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.style.width = '100%';
    btn.style.padding = '8px 12px';
    btn.style.textAlign = 'left';
    btn.style.background = '#e6f2ff';
    btn.style.border = '1px solid #b6d4ea';
    btn.style.borderRadius = '4px';
    btn.style.color = '#2c5a7a';
    btn.style.fontSize = '13px';
    btn.style.cursor = 'pointer';
    
    btn.onmouseover = () => { if(!answered) btn.style.background = '#d4e8f8'; };
    btn.onmouseout = () => { if(!answered) btn.style.background = '#e6f2ff'; };
    
    btn.onclick = () => selectOption(index, btn);
    container.appendChild(btn);
  });
}

function selectOption(index, btn) {
  if (answered) return;
  answered = true;
  
  const q = quizData[currentQ];
  const allBtns = document.getElementById('options-container').querySelectorAll('button');
  
  allBtns.forEach(b => {
    b.style.cursor = 'default';
    b.onmouseover = null;
    b.onmouseout = null;
  });
  
  if (index === q.correct) {
    btn.style.background = '#d4edda';
    btn.style.borderColor = '#28a745';
    btn.style.color = '#155724';
  } else {
    btn.style.background = '#f8d7da';
    btn.style.borderColor = '#dc3545';
    btn.style.color = '#721c24';
    
    allBtns[q.correct].style.background = '#d4edda';
    allBtns[q.correct].style.borderColor = '#28a745';
    allBtns[q.correct].style.color = '#155724';
  }
  
  const fbContainer = document.getElementById('feedback-container');
  const fbText = document.getElementById('feedback-text');
  const btnNext = document.getElementById('btn-next');
  
  fbContainer.style.display = 'block';
  fbText.innerHTML = `<b>${index === q.correct ? '✅ Верно!' : '❌ Неверно.'}</b> ${q.explanation}`;
  fbText.style.color = index === q.correct ? '#155724' : '#721c24';
  
  btnNext.style.display = 'block';
  btnNext.textContent = (currentQ === quizData.length - 1) ? 'Завершить' : 'Далее →';
}

function nextQuestion() {
  if (currentQ < quizData.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    document.getElementById('quiz-container').innerHTML = `
      <div style="text-align: center; padding: 20px;">
        <div style="font-size: 30px; margin-bottom: 10px;">🎉</div>
        <div style="font-size: 16px; font-weight: bold; color: #5b9bd5; margin-bottom: 5px;">Тест завершен!</div>
        <div style="font-size: 13px; color: #3b6a8a;">Вы прошли все вопросы.</div>
      </div>
    `;
  }
}

renderQuestion();
</script>
