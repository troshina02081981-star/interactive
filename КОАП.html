<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Административная ответственность в области промбезопасности</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #1a1a1a;
  }

  .slider {
    width: 100%;
    max-width: 640px;
  }

  .slider__header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 14px;
    color: #666;
  }

  .slider__block {
    font-weight: 600;
    color: #c0392b;
  }

  .card {
    background: #ffffff;
    border: 1px solid #e6e9ee;
    border-radius: 16px;
    padding: 32px;
    min-height: 320px;
    display: flex;
    flex-direction: column;
  }

  .card__article {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #c0392b;
    margin-bottom: 12px;
  }

  .card__title {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 20px;
    color: #111;
  }

  .card__label {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #888;
    margin-bottom: 10px;
  }

  .card__list {
    list-style: none;
    margin-bottom: 16px;
  }

  .card__list li {
    position: relative;
    padding: 8px 0 8px 20px;
    font-size: 15px;
    line-height: 1.45;
    color: #333;
    border-bottom: 1px solid #f0f2f5;
  }

  .card__list li:last-child { border-bottom: none; }

  .card__list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 16px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c0392b;
  }

  .card__note {
    margin-top: auto;
    padding-top: 16px;
    font-size: 14px;
    font-style: italic;
    color: #777;
    border-top: 1px dashed #e0e4ea;
  }

  .card__important {
    margin-top: 16px;
    padding: 12px 14px;
    background: #ffffff;
    border: 1px solid #f0e0b0;
    border-radius: 8px;
    font-size: 14px;
    color: #856404;
  }

  .slider__controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
    gap: 12px;
  }

  .btn {
    flex: 0 0 auto;
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
    background: #c0392b;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
  }

  .btn:hover { background: #a93226; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .dots {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e0e4ea;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .dot.active {
    background: #c0392b;
    transform: scale(1.3);
  }

  @media (max-width: 480px) {
    .card { padding: 24px 20px; min-height: 280px; }
    .card__title { font-size: 17px; }
    .btn { padding: 10px 16px; font-size: 14px; }
  }
</style>
</head>
<body>

<div class="slider">
  <div class="slider__header">
    <span class="slider__block" id="blockName"></span>
    <span id="counter"></span>
  </div>

  <div class="card" id="card">
    <div class="card__article" id="article"></div>
    <div class="card__title" id="title"></div>
    <div class="card__label" id="label"></div>
    <ul class="card__list" id="list"></ul>
    <div class="card__note" id="note"></div>
    <div class="card__important" id="important"></div>
  </div>

  <div class="slider__controls">
    <button class="btn" id="prev">← Назад</button>
    <div class="dots" id="dots"></div>
    <button class="btn" id="next">Вперёд →</button>
  </div>
</div>

<script>
  const cards = [
    {
      block: "Блок 1. Взаимодействие с надзором",
      article: "Статья 19.4 КоАП РФ",
      title: "Неповиновение законному распоряжению или требованию должностного лица органа госнадзора",
      label: "Наказание",
      items: [
        "Должностные лица: предупреждение или штраф от 2 до 4 тысяч рублей"
      ]
    },
    {
      block: "Блок 1. Взаимодействие с надзором",
      article: "Статья 19.4.1 КоАП РФ",
      title: "Воспрепятствование законной деятельности должностного лица органа госконтроля по проведению проверок или уклонение от таких проверок",
      label: "Наказание",
      items: [
        "Должностные лица: штраф от 2 до 4 тысяч рублей",
        "Юридические лица: штраф от 5 до 10 тысяч рублей"
      ]
    },
    {
      block: "Блок 1. Взаимодействие с надзором",
      article: "Статья 19.5 (п. 1) КоАП РФ",
      title: "Невыполнение в установленный срок законного предписания (постановления, представления, решения) органа или должностного лица, осуществляющего государственный надзор",
      label: "Наказание",
      items: [
        "Должностные лица: штраф от 1 до 2 тысяч рублей",
        "Юридические лица: штраф от 10 до 20 тысяч рублей"
      ]
    },
    {
      block: "Блок 1. Взаимодействие с надзором",
      article: "Статья 19.7 КоАП РФ",
      title: "Непредставление или несвоевременное представление в государственный надзорный орган сведений, представление которых предусмотрено законом и необходимо для осуществления этим органом его законной деятельности",
      label: "Наказание",
      items: [
        "Должностные лица: штраф от 300 до 500 рублей",
        "Юридические лица: штраф от 3 до 5 тысяч рублей"
      ]
    },
    {
      block: "Блок 2. Промбезопасность на ОПО",
      article: "Часть 1 ст. 9.1 КоАП РФ",
      title: "Нарушение требований промбезопасности или условий лицензий на осуществление видов деятельности в области промышленной безопасности ОПО",
      label: "Наказание",
      items: [
        "Должностные лица: штраф от 20 до 30 тысяч рублей либо дисквалификация на срок от 6 месяцев до 1 года",
        "Юридические лица: штраф от 200 до 300 тысяч рублей либо приостановление деятельности до 90 суток"
      ],
      note: "Пример: организация провела техперевооружение, но не подала в надзорный орган изменённые сведения об ОПО."
    },
    {
      block: "Блок 2. Промбезопасность на ОПО",
      article: "Часть 2 ст. 9.1 КоАП РФ",
      title: "Нарушение требований промбезопасности к получению, использованию, переработке, хранению, транспортировке, уничтожению и учёту взрывчатых веществ на ОПО",
      label: "Наказание",
      items: [
        "Должностные лица: штраф от 30 до 40 тысяч рублей с дисквалификацией на срок от 1 до 1,5 года",
        "Юридические лица: штраф от 300 до 400 тысяч рублей либо приостановление деятельности до 90 суток"
      ],
      note: "Пример: необеспечение сохранности взрывчатых материалов на складе."
    },
    {
      block: "Блок 2. Промбезопасность на ОПО",
      article: "Часть 3 ст. 9.1 КоАП РФ",
      title: "Грубое нарушение требований промбезопасности или грубое нарушение условий лицензии на осуществление видов деятельности в области безопасности ОПО",
      label: "Наказание",
      items: [
        "Должностные лица: штраф от 40 до 50 тысяч рублей с дисквалификацией на срок от 1 до 2 лет",
        "Юридические лица: штраф от 500 тысяч до 1 млн рублей либо приостановление деятельности до 90 суток"
      ],
      note: "Пример: разрушение стрелы крана из-за неудовлетворительного производственного контроля, которое обошлось без пострадавших."
    },
    {
      block: "Блок 3. Замена штрафа на предупреждение",
      article: "Статья 4.1.1 КоАП РФ",
      title: "Замена административного штрафа на предупреждение",
      label: "Кому доступно",
      items: [
        "Социально ориентированным НКО, включённым в соответствующий реестр",
        "Должностным лицам компаний",
        "Субъектам малого и среднего бизнеса из единого реестра МСП"
      ],
      important: "Условия (все одновременно): правонарушение совершено впервые; выявлено в ходе государственного контроля (надзора) либо муниципального контроля; нет вреда и угрозы причинения вреда жизни и здоровью людей, окружающей среде, объектам культурного наследия, безопасности государства; нет угрозы чрезвычайной ситуации природного и техногенного характера; нет имущественного ущерба; правонарушение не входит в закрытый перечень исключений по ч. 2 ст. 4.1.1 КоАП РФ. Если санкция статьи уже предусматривает предупреждение как альтернативу, вопрос о замене не возникает — предупреждение назначается напрямую."
    }
  ];

  let current = 0;

  const el = {
    blockName: document.getElementById("blockName"),
    counter: document.getElementById("counter"),
    article: document.getElementById("article"),
    title: document.getElementById("title"),
    label: document.getElementById("label"),
    list: document.getElementById("list"),
    note: document.getElementById("note"),
    important: document.getElementById("important"),
    dots: document.getElementById("dots"),
    prev: document.getElementById("prev"),
    next: document.getElementById("next")
  };

  function renderDots() {
    el.dots.innerHTML = "";
    cards.forEach((_, i) => {
      const dot = document.createElement("div");
      dot.className = "dot" + (i === current ? " active" : "");
      dot.addEventListener("click", () => goTo(i));
      el.dots.appendChild(dot);
    });
  }

  function render() {
    const c = cards[current];
    el.blockName.textContent = c.block;
    el.counter.textContent = (current + 1) + " / " + cards.length;
    el.article.textContent = c.article;
    el.title.textContent = c.title;
    el.label.textContent = c.label;

    el.list.innerHTML = "";
    c.items.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item;
      el.list.appendChild(li);
    });

    el.note.textContent = c.note || "";
    el.note.style.display = c.note ? "block" : "none";

    el.important.textContent = c.important || "";
    el.important.style.display = c.important ? "block" : "none";

    el.prev.disabled = current === 0;
    el.next.disabled = current === cards.length - 1;

    renderDots();
  }

  function goTo(index) {
    current = index;
    render();
  }

  el.prev.addEventListener("click", () => { if (current > 0) goTo(current - 1); });
  el.next.addEventListener("click", () => { if (current < cards.length - 1) goTo(current + 1); });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" && current > 0) goTo(current - 1);
    if (e.key === "ArrowRight" && current < cards.length - 1) goTo(current + 1);
  });

  render();
</script>

</body>
</html>
