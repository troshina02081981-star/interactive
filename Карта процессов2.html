<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта процессов ПБ</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;padding:14px;background:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:#1f2937;line-height:1.35;
    display:flex;justify-content:center;
  }
  .widget{
    max-width:560px;width:100%;background:#fff;
    border:1px solid #d1d5db;border-radius:12px;padding:14px 14px 16px;
  }
  .widget h1{font-size:15px;margin:0 0 4px}
  .lead{color:#6b7280;font-size:11.5px;margin:0 0 12px}

  /* Три колонки */
  .flow{
    display:grid;
    grid-template-columns:1fr 22px 1fr 22px 1fr;
    gap:0;
    align-items:start;
  }
  .stage{
    display:flex;flex-direction:column;gap:5px;
    background:#fff;border:1px solid #e5e7eb;border-radius:9px;
    padding:8px 6px;
  }
  .stage-title{
    font-size:10px;text-transform:uppercase;letter-spacing:.3px;
    color:#6b7280;font-weight:700;text-align:center;margin-bottom:3px;
  }
  .stage-title .role{
    display:block;font-size:9.5px;font-weight:500;
    text-transform:none;letter-spacing:0;color:#9ca3af;margin-top:2px;
  }

  .block{
    border:1px solid #e5e7eb;border-radius:7px;
    padding:6px 7px;cursor:pointer;font-size:11px;
    background:#fff;transition:.12s;user-select:none;
    text-align:left;
  }
  .block:hover{border-color:#2563eb;background:#f8fafc}
  .block.sel{border-color:#2563eb;background:#eff6ff}
  .block .name{font-weight:600;color:#111827;display:block;font-size:11.5px}
  .block .who{font-size:9.5px;color:#6b7280;display:block;margin-top:2px;line-height:1.25}

  .arrow{
    display:flex;align-items:center;justify-content:center;
    color:#2563eb;font-size:15px;font-weight:700;
    padding-top:34px;
  }

  /* Панель описания */
  .info{
    margin-top:12px;padding:11px 12px;border-radius:9px;
    background:#fff;border:1px solid #e5e7eb;
    font-size:12px;min-height:56px;
  }
  .info.empty{color:#6b7280;font-style:italic}
  .info h3{
    margin:0 0 7px;font-size:13px;color:#111827;
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  }
  .info .tag{
    font-size:9.5px;font-weight:600;text-transform:uppercase;
    letter-spacing:.3px;padding:2px 6px;border-radius:999px;
  }
  .tag.in{background:#eef2ff;color:#3730a3}
  .tag.sp{background:#ecfdf5;color:#065f46}
  .tag.out{background:#fef3c7;color:#92400e}

  .info .row{margin-bottom:7px}
  .info .row:last-child{margin-bottom:0}
  .info .lbl{
    font-size:9.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.3px;color:#6b7280;display:block;margin-bottom:2px;
  }
  .info .txt{color:#374151;font-size:11.5px;line-height:1.4}
  .info .auto-txt{color:#1d4ed8}

  @media(max-width:520px){
    .flow{grid-template-columns:1fr}
    .arrow{padding-top:0;transform:rotate(90deg);height:18px}
  }
</style>
</head>
<body>
<div class="widget">
  <h1>Карта процессов: данные → решение</h1>
  <p class="lead">Кликните по блоку — ниже появится, что это, кто с ним работает и что даёт автоматизация.</p>

  <div class="flow" id="flow"></div>

  <div class="info empty" id="info">Выберите блок — здесь появятся пояснения.</div>
</div>

<script>
const STAGES = [
  {
    title: "Входы",
    role: "откуда приходят данные",
    tag: "in",
    blocks: [
      { name:"Журналы", who:"Заполняют: мастера, специалисты ПБ",
        desc:"Инструктажи, обходы, дефекты, СИЗ, обучение.",
        auto:"Мобильные чек-листы с фото: записи не теряются, замечание сразу становится задачей." },
      { name:"Наряды-допуски", who:"Оформляют: подрядчики, ремонтные службы",
        desc:"Допуск подрядчиков и ремонтных работ.",
        auto:"Электронные наряды с проверкой условий и обученности — без бумажных согласований." },
      { name:"Оборудование", who:"Ведут: служба главного инженера, ПБ",
        desc:"Паспорта, история ремонтов, поверки, дефекты.",
        auto:"Карточка оборудования связана с документами, проверками и отчётами — одна точка правды." },
      { name:"Внешние сигналы", who:"Приходят: почта, СЭД, предписания",
        desc:"Почта, СЭД, предписания, заявки служб.",
        auto:"Письмо или предписание сразу становится задачей с объектом и сроком." }
    ]
  },
  {
    title: "Специалист по ПБ",
    role: "что делает с данными",
    tag: "sp",
    blocks: [
      { name:"Обходы", who:"Проводит: специалист ПБ",
        desc:"Осмотр объекта и фиксация нарушений.",
        auto:"Чек-листы, фото, автосоздание замечаний и задач с исполнителем и сроком." },
      { name:"Сроки", who:"Контролирует: специалист ПБ",
        desc:"Предписания, мероприятия, экспертизы, аттестации, поверки.",
        auto:"Напоминания, эскалации, дашборд просрочек — сроки не в голове." },
      { name:"Инциденты", who:"Ведёт: специалист ПБ, комиссия",
        desc:"Фиксация, расследование, корректирующие мероприятия.",
        auto:"Цепочка фиксация → задача → меры → закрытие, с аналитикой причин." },
      { name:"Документы", who:"Отвечает: специалист ПБ",
        desc:"Инструкции, паспорта, заключения, СИЗ, обученность.",
        auto:"Реестр документов привязан к объектам и ролям, версии актуальны." },
      { name:"Коммуникация", who:"Связывает: цеха, подрядчики, службы",
        desc:"Цеха, подрядчики, ремонтные и технические службы.",
        auto:"Задачи по ролям и зонам ответственности, статус виден всем." }
    ]
  },
  {
    title: "Выходы",
    role: "что получается на выходе",
    tag: "out",
    blocks: [
      { name:"Отчёты", who:"Получают: руководство, Ростехнадзор, Роструд",
        desc:"Внутренние, Ростехнадзор, Роструд, статистика.",
        auto:"Автосбор из связанных данных — без ручной сборки." },
      { name:"Закрытые замечания", who:"Подтверждает: специалист ПБ",
        desc:"Подтверждённое устранение нарушений.",
        auto:"Закрытие с фото и историей — формальных закрытий меньше." },
      { name:"Готовность к проверке", who:"Оценивает: инспектор",
        desc:"Полный комплект достоверных данных.",
        auto:"Онлайн-картина и след: инспектор видит реальную работу системы." },
      { name:"Управление рисками", who:"Использует: руководство",
        desc:"Решения на основе данных, а не постфактум.",
        auto:"Аналитика и цифровой двойник — риск виден до инцидента." }
    ]
  }
];

const flow = document.getElementById("flow");
const info = document.getElementById("info");
const tagLabel = { in:"Вход", sp:"Специалист ПБ", out:"Выход" };

STAGES.forEach((stage, si) => {
  const col = document.createElement("div");
  col.className = "stage";

  const t = document.createElement("div");
  t.className = "stage-title";
  t.innerHTML = `${stage.title}<span class="role">${stage.role}</span>`;
  col.appendChild(t);

  stage.blocks.forEach(b => {
    const el = document.createElement("div");
    el.className = "block";
    el.innerHTML = `<span class="name">${b.name}</span><span class="who">${b.who}</span>`;
    el.addEventListener("click", () => {
      document.querySelectorAll(".block").forEach(x => x.classList.remove("sel"));
      el.classList.add("sel");
      info.classList.remove("empty");
      info.innerHTML = `
        <h3>${b.name} <span class="tag ${stage.tag}">${tagLabel[stage.tag]}</span></h3>
        <div class="row">
          <span class="lbl">Кто работает</span>
          <span class="txt">${b.who}</span>
        </div>
        <div class="row">
          <span class="lbl">Что это</span>
          <span class="txt">${b.desc}</span>
        </div>
        <div class="row">
          <span class="lbl">Что даёт автоматизация</span>
          <span class="txt auto-txt">${b.auto}</span>
        </div>
      `;
    });
    col.appendChild(el);
  });

  flow.appendChild(col);

  if (si < STAGES.length - 1) {
    const a = document.createElement("div");
    a.className = "arrow";
    a.textContent = "→";
    flow.appendChild(a);
  }
});
</script>
</body>
</html>
