<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Универсальная формула промпта</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 4px 10px;
            box-sizing: border-box;
        }

        .scheme-container {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Заголовок */
        .title-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #f0f7ff;
            border: 1px solid #cce0ff;
            border-radius: 50px;
            padding: 6px 16px;
            color: #1a56db;
            font-weight: 700;
            font-size: 13px;
            align-self: center;
        }

        .title-box svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #1a56db;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Формула */
        .formula-row {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }

        .block {
            flex: 1;
            background-color: #f8fbff;
            border: 1px solid #cce0ff;
            border-radius: 8px;
            padding: 8px 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .icon-circle {
            width: 24px;
            height: 24px;
            background-color: #1a56db;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .icon-circle svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .block-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
            text-align: left;
        }

        .block-title {
            font-size: 10px;
            font-weight: 700;
            color: #1a56db;
            margin-bottom: 2px;
            line-height: 1.1;
        }

        .block-desc {
            font-size: 8px;
            color: #666;
            line-height: 1.1;
        }

        .plus-sign {
            font-size: 14px;
            font-weight: 400;
            color: #1a56db;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 0 1px;
        }

        /* Подсказка */
        .tip-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #f8fbff;
            border: 1px solid #cce0ff;
            border-radius: 8px;
            padding: 8px 12px;
            color: #1a56db;
            font-size: 9.5px;
            font-weight: 600;
            line-height: 1.2;
        }

        .tip-icon {
            width: 16px;
            height: 16px;
            background-color: #1a56db;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            color: #fff;
            font-weight: bold;
            font-size: 10px;
            font-style: italic;
            font-family: Georgia, serif;
        }
    </style>
</head>
<body>

    <div class="scheme-container">
        
        <!-- Заголовок -->
        <div class="title-box">
            <svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-7 7c0 2.5 1.5 4.5 3 6 .5.5 1 1.5 1 2h6c0-.5.5-1.5 1-2 1.5-1.5 3-3.5 3-6a7 7 0 0 0-7-7z"/></svg>
            <span>Универсальная формула</span>
        </div>

        <!-- Формула -->
        <div class="formula-row">
            
            <div class="block">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg>
                </div>
                <div class="block-text">
                    <div class="block-title">Задача</div>
                    <div class="block-desc">Что нужно сделать</div>
                </div>
            </div>

            <div class="plus-sign">+</div>

            <div class="block">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                </div>
                <div class="block-text">
                    <div class="block-title">Контекст</div>
                    <div class="block-desc">Где и для чего</div>
                </div>
            </div>

            <div class="plus-sign">+</div>

            <div class="block">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
                </div>
                <div class="block-text">
                    <div class="block-title">Ограничения</div>
                    <div class="block-desc">Что учитывать</div>
                </div>
            </div>

            <div class="plus-sign">+</div>

            <div class="block">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                </div>
                <div class="block-text">
                    <div class="block-title">Формат</div>
                    <div class="block-desc">Как должен выглядеть ответ</div>
                </div>
            </div>

        </div>

        <!-- Подсказка -->
        <div class="tip-box">
            <div class="tip-icon">i</div>
            <div>Чем точнее вы сформулируете задачу, тем полезнее будет ответ нейросети.</div>
        </div>

    </div>

</body>
</html>
