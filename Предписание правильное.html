<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предписание vs Предостережение</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #ffffff;
            padding: 30px 20px;
            margin: 0;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            padding: 30px 26px 28px;
            border: 1px solid #eef2f6;
        }
        h1 {
            font-size: 22px;
            color: #0b2b4a;
            margin: 0 0 4px 0;
        }
        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 22px;
        }

        /* ===== СЛАЙДЕР ===== */
        .slider {
            position: relative;
        }
        .slide-viewport {
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        .slide-track {
            display: flex;
            transition: transform 0.3s ease;
        }
        .slide {
            min-width: 100%;
            padding: 22px 20px 20px;
            box-sizing: border-box;
        }
        .slide .criteria {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .slide .slide-title {
            font-size: 17px;
            font-weight: 700;
            color: #0b2b4a;
            margin-bottom: 14px;
        }
        .slide .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 520px) {
            .slide .cards { grid-template-columns: 1fr; }
        }
        .slide .card {
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 13.5px;
            line-height: 1.5;
        }
        .slide .card.prescription {
            background: #fef2f2;
            border: 1px solid #fecaca;
        }
        .slide .card.warning {
            background: #fffbeb;
            border: 1px solid #fde68a;
        }
        .slide .card .label {
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
            display: block;
        }
        .slide .card.prescription .label { color: #991b1b; }
        .slide .card.warning .label { color: #92400e; }
        .slide .card .text { color: #1e293b; }
        .slide .card .text strong { color: #0b2b4a; }

        .badge {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-danger  { background: #fee2e2; color: #991b1b; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-success { background: #dcfce7; color: #15803d; }
        .badge-gray    { background: #f1f5f9; color: #64748b; }

        /* ===== НАВИГАЦИЯ ===== */
        .slider-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            gap: 12px;
        }
        .slider-nav .arrow-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid #d1d9e6;
            background: #ffffff;
            color: #2563eb;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .slider-nav .arrow-btn:hover {
            background: #eef2ff;
            border-color: #2563eb;
        }
        .slider-nav .arrow-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .slider-nav .dots {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            justify-content: center;
            flex: 1;
        }
        .slider-nav .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e1;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            padding: 0;
        }
        .slider-nav .dot.active {
            background: #2563eb;
            transform: scale(1.3);
        }

        .counter {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 10px;
        }

        .hint {
            font-size: 12.5px;
            color: #94a3b8;
            margin-top: 18px;
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px dashed #d1d9e6;
            text-align: center;
        }

        @media (max-width: 640px) {
            .container { padding: 20px 16px; }
            h1 { font-size: 19px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚖️ Предписание vs Предостережение</h1>
    <div class="subtitle">
        Листайте стрелками — один пункт сравнения на экране
    </div>

    <!-- СЛАЙДЕР -->
    <div class="slider">
        <div class="slide-viewport">
            <div class="slide-track" id="slideTrack">
                <!-- заполняется скриптом -->
            </div>
        </div>

        <div class="slider-nav">
            <button class="arrow-btn" id="prevBtn" title="Назад">‹</button>
            <div class="dots" id="dots"></div>
            <button class="arrow-btn" id="nextBtn" title="Вперёд">›</button>
        </div>

        <div class="counter" id="counter">1 / 10</div>
    </div>

    <div class="hint">
        💡 Всего 10 критериев сравнения. Используйте стрелки или точки для навигации.
    </div>
</div>

<script>
// ================================================================
// ДАННЫЕ
// ================================================================
const SLIDES = [
    {
        criteria: 'Общая информация',
        title: 'Что это',
        prescription: '<strong>Предписание</strong> — обязательное требование устранить нарушения, выявленные при проверке.',
        warning: '<strong>Предостережение</strong> — профилактическая мера, предупреждение о возможных нарушениях. Не наказание, а шанс исправиться.'
    },
    {
        criteria: 'Общая информация',
        title: 'Основание выдачи',
        prescription: 'Выявлены нарушения <strong>по результатам проверки</strong> (выездной или документарной).',
        warning: 'Подозрение на нарушение — <strong>без проверки</strong>. На основании информации от органов власти, СМИ, обращений граждан.'
    },
    {
        criteria: 'Общая информация',
        title: 'Кто выдаёт',
        prescription: 'Инспектор Ростехнадзора, проводивший проверку. Документ подписывается и заверяется печатью.',
        warning: 'Должностное лицо Ростехнадзора — по своей инициативе или на основании поступившей информации.'
    },
    {
        criteria: 'Содержание',
        title: 'Что содержит',
        prescription: 'Конкретные нарушения со ссылками на НПА и <strong>обязательные сроки</strong> устранения по каждому пункту.',
        warning: 'Описание рисков и <strong>рекомендации</strong> по устранению. Сроки — рекомендательные или не указываются вовсе.'
    },
    {
        criteria: 'Содержание',
        title: 'Сроки устранения',
        prescription: '<span class="badge badge-danger">Обязательные</span> конкретные даты. Обычно 15–30 рабочих дней.',
        warning: '<span class="badge badge-gray">Рекомендательные</span> или без срока. Жёстких дедлайнов нет.'
    },
    {
        criteria: 'Ответственность',
        title: 'Ответственность',
        prescription: '<span class="badge badge-danger">Штраф</span> до 500 000 ₽ (ст. 9.1 КоАП РФ) или приостановка деятельности до 90 суток.',
        warning: '<span class="badge badge-success">Без санкций</span>. Это профилактика — штрафа за само предостережение нет.'
    },
    {
        criteria: 'Ответственность',
        title: 'Размер штрафа',
        prescription: 'До <strong>500 000 ₽</strong> для юрлиц, до <strong>40 000 ₽</strong> для должностных лиц. Возможна приостановка деятельности.',
        warning: '<span class="badge badge-success">Штрафа нет</span> — предостережение само по себе не влечёт административного наказания.'
    },
    {
        criteria: 'Действия организации',
        title: 'Срок ответа',
        prescription: 'Указан в предписании — обычно 15–30 рабочих дней. Нужно отчитаться о выполнении каждого пункта.',
        warning: '20 рабочих дней на ответ или возражение. Если не согласны — направьте возражение.'
    },
    {
        criteria: 'Действия организации',
        title: 'Обжалование',
        prescription: '<span class="badge badge-danger">10 рабочих дней</span> — жалоба в Ростехнадзор. <span class="badge badge-warning">3 месяца</span> — в суд.',
        warning: '<span class="badge badge-gray">20 рабочих дней</span> — возражение в Ростехнадзор. При положительном решении действий не требуется.'
    },
    {
        criteria: 'Итог',
        title: 'Главное отличие',
        prescription: '<span class="badge badge-danger">Обязательное исполнение</span>. Игнорировать нельзя — это нарушение со штрафом.',
        warning: '<span class="badge badge-success">Добровольное исполнение</span>. Игнорировать тоже нельзя, но санкций за сам документ нет.'
    }
];

// ================================================================
// СЛАЙДЕР
// ================================================================
const track = document.getElementById('slideTrack');
const dotsContainer = document.getElementById('dots');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let currentSlide = 0;

function renderSlides() {
    track.innerHTML = '';
    dotsContainer.innerHTML = '';

    SLIDES.forEach((slide, index) => {
        // Слайд
        const slideEl = document.createElement('div');
        slideEl.className = 'slide';
        slideEl.innerHTML = `
            <div class="criteria">${slide.criteria}</div>
            <div class="slide-title">${slide.title}</div>
            <div class="cards">
                <div class="card prescription">
                    <span class="label">📄 Предписание</span>
                    <div class="text">${slide.prescription}</div>
                </div>
                <div class="card warning">
                    <span class="label">⚠️ Предостережение</span>
                    <div class="text">${slide.warning}</div>
                </div>
            </div>
        `;
        track.appendChild(slideEl);

        // Точка
        const dot = document.createElement('button');
        dot.className = 'dot' + (index === 0 ? ' active' : '');
        dot.dataset.index = index;
        dot.addEventListener('click', () => goToSlide(index));
        dotsContainer.appendChild(dot);
    });

    updateSlider();
}

function updateSlider() {
    track.style.transform = `translateX(-${currentSlide * 100}%)`;

    document.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === currentSlide);
    });

    counter.textContent = `${currentSlide + 1} / ${SLIDES.length}`;

    prevBtn.disabled = (currentSlide === 0);
    nextBtn.disabled = (currentSlide === SLIDES.length - 1);
}

function goToSlide(index) {
    if (index < 0 || index >= SLIDES.length) return;
    currentSlide = index;
    updateSlider();
}

prevBtn.addEventListener('click', () => goToSlide(currentSlide - 1));
nextBtn.addEventListener('click', () => goToSlide(currentSlide + 1));

// Свайпы
let touchStartX = 0;
track.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
}, { passive: true });
track.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) {
        if (diff > 0) goToSlide(currentSlide + 1);
        else goToSlide(currentSlide - 1);
    }
});

// Стрелки клавиатуры
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') goToSlide(currentSlide - 1);
    if (e.key === 'ArrowRight') goToSlide(currentSlide + 1);
});

// ================================================================
// СТАРТ
// ================================================================
renderSlides();
</script>

</body>
</html>
