<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ключевые изменения: раньше → сейчас</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff;
    margin: 0 auto;
    padding: 6px 10px;
    color: #1a2332;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  h1 {
    text-align: center;
    font-size: 14px;
    margin: 0 0 1px;
    color: #1f4e79;
  }
  .subtitle {
    text-align: center;
    color: #6b7785;
    margin: 0 0 5px;
    font-size: 10px;
  }
  .controls {
    text-align: center;
    margin-bottom: 5px;
  }
  .controls button {
    background: #fff;
    color: #1f4e79;
    border: 1px solid #1f4e79;
    border-radius: 4px;
    padding: 1px 8px;
    font-size: 10px;
    cursor: pointer;
    margin: 0 2px;
  }
  .controls button:hover { background: #1f4e79; color: #fff; }

  /* Ромашка: 2 сверху, 1 по центру, 2 снизу */
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 5px;
    min-height: 0;
    max-height: 320px;
  }
  .card:nth-child(1) { grid-column: 1 / 3; grid-row: 1; }
  .card:nth-child(2) { grid-column: 3 / 5; grid-row: 1; }
  .card:nth-child(3) { grid-column: 1 / 3; grid-row: 2; }
  .card:nth-child(4) { grid-column: 3 / 5; grid-row: 2; }
  .card:nth-child(5) { grid-column: 2 / 4; grid-row: 3; }
  .grid { grid-template-rows: repeat(3, 1fr); }

  .card {
    perspective: 1000px;
    cursor: pointer;
    min-height: 0;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform .35s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 5px;
    padding: 4px 6px 9px;
    display: flex;
    flex-direction: column;
    border: 1px solid #d0dbe8;
    overflow: hidden;
  }
  .face-front { background: #fff; }
  .face-back {
    background: #1f4e79;
    color: #fff;
    border-color: #1f4e79;
    transform: rotateY(180deg);
  }
  .label {
    font-size: 8px;
    letter-spacing: .3px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 1px;
  }
  .face-front .label { color: #1f4e79; }
  .face-back .label { color: #a8c8e8; }
  .card h3 {
    font-size: 11px;
    margin: 0 0 1px;
    line-height: 1.05;
    color: #1a2332;
  }
  .face-back h3 { color: #fff; }
  .card p {
    font-size: 10px;
    line-height: 1.12;
    margin: 0;
    color: #3a4a5c;
  }
  .face-back p { color: #e6eef7; }
  .flip-hint {
    position: absolute;
    bottom: 1px;
    right: 4px;
    font-size: 8px;
    color: #8a99aa;
  }
  .face-back .flip-hint { color: #a8c8e8; }
</style>
</head>
<body>

<h1>Ключевые изменения: раньше → сейчас</h1>
<p class="subtitle">Нажмите на карточку, чтобы увидеть, как изменился процесс</p>

<div class="controls">
  <button onclick="flipAll()">Показать все</button>
  <button onclick="resetAll()">Сбросить</button>
</div>

<div class="grid" id="grid"></div>

<script>
const data = [
  {
    title: "Риск-ориентированный подход",
    before: "Проверки по общему графику: добросовестный бизнес проверяют наравне со всеми, лишние визиты отнимают время и ресурсы.",
    after: "Информационные системы автоматически оценивают уровень риска предприятия — добросовестный бизнес избавлен от лишних проверок."
  },
  {
    title: "Дистанционный контроль (СДК ПБ)",
    before: "Инспектор приезжает на ОПО, смотрит показания вручную, отклонения выявляются с задержкой — часто уже после инцидента.",
    after: "Датчики на ОПО в реальном времени передают телеметрию в госсистему. Алгоритмы ловят отклонения и сигналят о предаварии еще до срабатывания противоаварийной защиты."
  },
  {
    title: "Мониторинг",
    before: "Разовые замеры и отчеты: видно только текущее состояние, динамика и тенденции остаются за кадром.",
    after: "Системы непрерывно отслеживают состояние объектов и показатели безопасности, накапливают данные и выявляют тенденции — видно не только отклонение, но и как ситуация развивается во времени."
  },
  {
    title: "Мобильный инспектор",
    before: "Выездные мероприятия: инспектор едет на объект, осмотр занимает день, фото и видео можно подменить.",
    after: "Осмотры по видеосвязи через приложение «Инспектор»: автоматическая геолокация и защита фото- и видеоматериалов от подмены. Выезды массово заменяются удаленными форматами."
  },
  {
    title: "Сервисы для бизнеса",
    before: "Уведомления о проверках — по почте или лично, документы инспектору везли в ведомство, обжалование — через визиты.",
    after: "Через «Госуслуги Бизнес»: уведомления о проверках, отправка документов инспектору и досудебное обжалование — без визитов в ведомство."
  }
];

const grid = document.getElementById('grid');

data.forEach(item => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-inner">
      <div class="face face-front">
        <div class="label">Раньше</div>
        <h3>${item.title}</h3>
        <p>${item.before}</p>
        <div class="flip-hint">нажмите →</div>
      </div>
      <div class="face face-back">
        <div class="label">Сейчас</div>
        <h3>${item.title}</h3>
        <p>${item.after}</p>
        <div class="flip-hint">← назад</div>
      </div>
    </div>
  `;
  card.addEventListener('click', () => card.classList.toggle('flipped'));
  grid.appendChild(card);
});

function flipAll() {
  document.querySelectorAll('.card').forEach(c => c.classList.add('flipped'));
}
function resetAll() {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('flipped'));
}
</script>

</body>
</html>
