<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заполнение паспорта и реестр</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg-white: #ffffff;
            --text: #333333;
            --border: #e2e8f0;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --gray: #94a3b8;
        }

        /* Чистый белый фон */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .interactive-wrapper {
            background-color: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px; /* Уменьшил внутренние отступы */
            max-width: 560px; /* Установлена ширина 560px */
            width: 100%;
            box-sizing: border-box;
            margin-top: 20px;
        }

        .title {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 700;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px; /* Уменьшил расстояние между колонками */
        }

        @media (max-width: 600px) {
            .grid-layout { grid-template-columns: 1fr; }
        }

        /* --- ЛЕВАЯ ЧАСТЬ: ФОРМА --- */
        .form-panel h3 {
            margin-top: 0;
            font-size: 15px;
            color: var(--primary);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            color: var(--gray);
            font-weight: 600;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
            background-color: #ffffff;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.1);
        }

        .action-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .action-btn:hover { background-color: #2980b9; }
        .action-btn:active { transform: scale(0.98); }

        /* --- ПРАВАЯ ЧАСТЬ: РЕЕСТР --- */
        .registry-panel h3 {
            margin-top: 0;
            font-size: 15px;
            color: var(--primary);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .registry-stats {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .stat-box {
            flex: 1;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px;
            text-align: center;
        }

        .stat-box .number {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
        }

        .stat-box .label {
            font-size: 9px;
            color: var(--gray);
            text-transform: uppercase;
        }

        .stat-box.alert .number { color: var(--danger); }
        .stat-box.warn .number { color: var(--warning); }

        .equipment-list {
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            max-height: 300px; /* Уменьшил высоту списка */
            overflow-y: auto;
            background-color: #ffffff;
        }

        .eq-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px; /* Уменьшил отступы в карточках */
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            background: #ffffff;
            animation: slideIn 0.3s ease;
        }

        .eq-row:last-child { border-bottom: none; }

        .eq-info { display: flex; flex-direction: column; gap: 1px; }
        .eq-name { font-weight: 600; color: var(--primary); }
        .eq-date { font-size: 10px; color: var(--gray); }

        .eq-status {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 6px;
            border-radius: 10px;
            white-space: nowrap;
        }
        
        .status-ok { background: #e8f8f5; color: var(--success); }
        .status-warn { background: #fef5e7; color: var(--warning); }
        .status-danger { background: #fdedec; color: var(--danger); }

        .empty-state {
            padding: 20px 10px;
            text-align: center;
            color: var(--gray);
            font-size: 12px;
            font-style: italic;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

<div class="interactive-wrapper">
    <h2 class="title">📋 Заполни паспорт — собери реестр</h2>

    <div class="grid-layout">
        
        <!-- ЛЕВАЯ ПАНЕЛЬ: ФОРМА ЗАПОЛНЕНИЯ -->
        <div class="form-panel">
            <h3>Новый паспорт оборудования</h3>
            
            <div class="form-group">
                <label>Наименование</label>
                <input type="text" id="eqName" value="Насос центробежный">
            </div>
            
            <div class="form-group">
                <label>Заводской номер</label>
                <input type="text" id="eqSerial" value="NA-2045">
            </div>

            <div class="form-group">
                <label>Место установки</label>
                <input type="text" id="eqLocation" value="Цех №3">
            </div>

            <div class="form-group">
                <label>Дата освидетельствования</label>
                <input type="date" id="eqDate" value="2025-12-01">
            </div>

            <button class="action-btn" onclick="addToRegistry()">Внести в реестр ➔</button>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ: РЕЕСТР -->
        <div class="registry-panel">
            <h3>Живой реестр</h3>
            
            <div class="registry-stats">
                <div class="stat-box">
                    <div class="number" id="statTotal">0</div>
                    <div class="label">Всего</div>
                </div>
                <div class="stat-box alert">
                    <div class="number" id="statOverdue">0</div>
                    <div class="label">Просроч.</div>
                </div>
                <div class="stat-box warn">
                    <div class="number" id="statSoon">0</div>
                    <div class="label">Скоро</div>
                </div>
            </div>

            <div class="equipment-list" id="registryList">
                <div class="empty-state" id="emptyState">Реестр пуст. Заполните паспорт слева.</div>
            </div>
        </div>

    </div>
</div>

<script>
    let registryData = [];

    function addToRegistry() {
        const name = document.getElementById('eqName').value;
        const serial = document.getElementById('eqSerial').value;
        const location = document.getElementById('eqLocation').value;
        const dateStr = document.getElementById('eqDate').value;

        if (!name || !dateStr) {
            alert("Пожалуйста, заполните наименование и дату.");
            return;
        }

        const item = {
            id: Date.now(),
            name: name,
            serial: serial,
            location: location,
            date: dateStr
        };

        registryData.push(item);
        renderRegistry();

        document.getElementById('eqName').value = '';
        document.getElementById('eqSerial').value = '';
        document.getElementById('eqLocation').value = '';
    }

    function renderRegistry() {
        const list = document.getElementById('registryList');
        list.innerHTML = '';
        
        let total = registryData.length;
        let overdue = 0;
        let soon = 0;
        
        const today = new Date();
        today.setHours(0,0,0,0);

        registryData.forEach(item => {
            const targetDate = new Date(item.date);
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            let statusText = '';
            let statusClass = '';
            
            if (diffDays < 0) {
                statusText = 'Просрочено';
                statusClass = 'status-danger';
                overdue++;
            } else if (diffDays <= 30) {
                statusText = `Через ${diffDays} дн.`;
                statusClass = 'status-warn';
                soon++;
            } else {
                statusText = 'В норме';
                statusClass = 'status-ok';
            }

            const dateFormatted = targetDate.toLocaleDateString('ru-RU');

            const row = document.createElement('div');
            row.className = 'eq-row';
            row.innerHTML = `
                <div class="eq-info">
                    <span class="eq-name">${item.name}</span>
                    <span class="eq-date">№ ${item.serial} | Освид: ${dateFormatted}</span>
                </div>
                <span class="eq-status ${statusClass}">${statusText}</span>
            `;
            
            list.appendChild(row);
        });

        document.getElementById('statTotal').textContent = total;
        document.getElementById('statOverdue').textContent = overdue;
        document.getElementById('statSoon').textContent = soon;

        if (total === 0) {
            list.innerHTML = '<div class="empty-state" id="emptyState">Реестр пуст. Заполните паспорт слева.</div>';
        }
    }
</script>

</body>
</html>
