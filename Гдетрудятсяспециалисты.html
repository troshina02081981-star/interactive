<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Где трудятся специалисты по промбезопасности</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 10px;
    }

    .container {
        width: 100%;
        max-width: 560px;
        background: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        padding: 20px;
        /* Тень убрана */
    }

    .header {
        text-align: center;
        margin-bottom: 20px;
        border-bottom: 2px solid #eaf2fb;
        padding-bottom: 15px;
    }

    .header h1 {
        color: #1a3a6b;
        font-size: 16px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        line-height: 1.3;
    }

    .layout {
        display: flex;
        gap: 15px;
        align-items: flex-start;
    }

    /* Левая колонка с организациями */
    .org-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 45%;
    }

    .org-btn {
        background: #ffffff;
        border: 1.5px solid #b0cceb;
        border-radius: 6px;
        padding: 10px;
        font-size: 11px;
        font-weight: 700;
        color: #2c5aa0;
        cursor: pointer;
        text-align: left;
        transition: all 0.2s;
        position: relative;
        /* Тень убрана */
    }

    .org-btn:hover {
        background: #f4f8fd;
    }

    .org-btn.active {
        background: #2c5aa0;
        color: #ffffff;
        border-color: #1a3a6b;
        /* Тень убрана */
    }

    .org-btn.active::after {
        content: '➔';
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 14px;
    }

    /* Правая колонка с описанием */
    .info-card {
        background: #f8fbff;
        border: 1px solid #dce8f5;
        border-radius: 8px;
        padding: 15px;
        width: 55%;
        min-height: 200px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        /* Тень убрана */
    }

    .info-card::before {
        content: '';
        position: absolute;
        left: -8px;
        top: 50%;
        transform: translateY(-50%) rotate(45deg);
        width: 14px;
        height: 14px;
        background: #f8fbff;
        border-left: 1px solid #dce8f5;
        border-bottom: 1px solid #dce8f5;
    }

    .role-title {
        color: #1a3a6b;
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 8px;
    }

    .role-desc {
        font-size: 12px;
        color: #333;
        line-height: 1.5;
    }

    .role-quote {
        font-style: italic;
        color: #5b7ba8;
        font-size: 12px;
        margin-top: 10px;
        padding-left: 10px;
        border-left: 3px solid #8ec5ff;
    }

    /* Анимация смены контента */
    .fade-in {
        animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateX(-5px); }
        to { opacity: 1; transform: translateX(0); }
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Где трудятся специалисты<br>по промышленной безопасности</h1>
    </div>

    <div class="layout">
        <!-- Список организаций -->
        <div class="org-list">
            <button class="org-btn active" onclick="showInfo('proj', this)">Проектные организации</button>
            <button class="org-btn" onclick="showInfo('podr', this)">Подрядные организации</button>
            <button class="org-btn" onclick="showInfo('exp', this)">Экспертные организации</button>
            <button class="org-btn" onclick="showInfo('nadz', this)">Надзорные органы</button>
            <button class="org-btn" onclick="showInfo('expl', this)">Эксплуатирующие организации</button>
        </div>

        <!-- Карточка с описанием -->
        <div class="info-card" id="info-card">
            <div id="card-content" class="fade-in">
                <div class="role-title" id="role-title">Проектировщик</div>
                <div class="role-desc" id="role-desc">
                    Делаю расчеты и определяю, как будет выглядеть будущий ОПО. Закладываю безопасность на этапе чертежей.
                </div>
                <div class="role-quote" id="role-quote">
                    «Безопасность начинается с проекта»
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // База данных для каждой организации
    const data = {
        proj: {
            title: "Проектировщик",
            desc: "Делаю расчеты и определяю, как будет выглядеть будущий ОПО. Закладываю безопасность на этапе чертежей.",
            quote: "«Безопасность начинается с проекта»"
        },
        podr: {
            title: "Подрядчик (Строитель)",
            desc: "Слежу, чтобы мои работники соблюдали требования во время работ на ОПО. Контролирую стройку и монтаж.",
            quote: "«Качество монтажа — залог будущей безопасности»"
        },
        exp: {
            title: "Эксперт",
            desc: "Провожу независимую оценку состояния ОПО. Даю заключение: можно ли эксплуатировать объект дальше.",
            quote: "«Независимый взгляд со стороны»"
        },
        nadz: {
            title: "Инспектор (Надзор)",
            desc: "Проверяю и расследую аварии на ОПО. Выдаю предписания и слежу за их исполнением.",
            quote: "«Государственный контроль и справедливость»"
        },
        expl: {
            title: "Специалист (Эксплуатация)",
            desc: "С чего бы мне начать? Работаю на действующем объекте: провожу ПК, аттестации, веду документацию, реагирую на инциденты.",
            quote: "«Ежедневная рутина и контроль»"
        }
    };

    function showInfo(id, btn) {
        // 1. Убираем активный класс со всех кнопок
        document.querySelectorAll('.org-btn').forEach(b => b.classList.remove('active'));
        // 2. Добавляем кликнутой
        btn.classList.add('active');

        // 3. Обновляем контент
        const item = data[id];
        document.getElementById('role-title').textContent = item.title;
        document.getElementById('role-desc').textContent = item.desc;
        document.getElementById('role-quote').textContent = item.quote;

        // 4. Перезапускаем анимацию
        const content = document.getElementById('card-content');
        content.classList.remove('fade-in');
        void content.offsetWidth;
        content.classList.add('fade-in');
    }
</script>
</body>
</html>
