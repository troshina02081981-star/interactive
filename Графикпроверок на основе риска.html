<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=560"><title>График проверок — Гант</title>
<style>
*{box-sizing:border-box;font:11px/1.3 system-ui,Arial;margin:0}
body{background:#fff;color:#1f2937;max-width:560px;margin:0 auto;padding:8px}
h1{font-size:13px;margin-bottom:6px}
.p{border:1px solid #e5e7eb;border-radius:6px;padding:8px;margin-bottom:6px}
.axis{display:flex;margin-left:120px;margin-bottom:3px}
.axis span{flex:1;text-align:center;font-size:8px;color:#9ca3af;border-left:1px solid #f3f4f6}
.gantt{position:relative}
.row{display:flex;align-items:center;height:22px;margin-bottom:2px}
.row .lbl{width:120px;flex:0 0 120px;display:flex;align-items:center;gap:3px;padding-right:4px}
.row .lbl .n{font-size:10px;font-weight:600;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.b{display:inline-block;padding:0 3px;border-radius:4px;font-size:8px;font-weight:600;color:#fff;line-height:11px}
.c1{background:#dc2626}.c2{background:#ea580c}.c3{background:#ca8a04}.c4{background:#2563eb}
.track{flex:1;position:relative;height:22px;background:repeating-linear-gradient(90deg,#fff 0 calc(100%/12 - 1px),#f3f4f6 calc(100%/12 - 1px) calc(100%/12));border-radius:3px}
.bar{position:absolute;top:8px;height:6px;background:#dbeafe;border-radius:3px}
.dot{position:absolute;top:7px;width:8px;height:8px;border-radius:50%;transform:translateX(-50%);cursor:pointer;border:1px solid #fff}
.dot.К{background:#2563eb}
.dot.Т{background:#7c3aed}
.dot.О{background:#0891b2}
.dot.В{background:#dc2626}
.dot:hover{box-shadow:0 0 0 2px #bfdbfe}
.crit{display:flex;gap:1px}
.crit button{padding:0 2px;font-size:8px;border:1px solid #d1d5db;background:#fff;color:#6b7280;border-radius:2px;cursor:pointer;line-height:11px}
.crit button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.legend{display:flex;gap:10px;font-size:8px;color:#6b7280;margin-top:6px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:3px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sum{border-left:3px solid #2563eb;background:#eff6ff;padding:5px 7px;border-radius:3px;font-size:10px;line-height:1.5;margin-bottom:5px}
.sum b{color:#1e40af}
.warn{border-left:3px solid #d97706;background:#fffbeb;padding:3px 6px;border-radius:3px;font-size:9px;margin-bottom:3px}
.warn.bad{border-color:#dc2626;background:#fef2f2}
.warn.ok{border-color:#16a34a;background:#f0fdf4}
.warn b{display:block}
.btns{display:flex;gap:4px;margin-top:5px}
.btns button{flex:1;padding:3px;font-size:9px;border:1px solid #93c5fd;background:#fff;color:#2563eb;border-radius:3px;cursor:pointer}
.btns button:hover{background:#eff6ff}
</style></head><body>

<h1>График проверок на основе риска</h1>

<div class="p">
  <div class="axis" id="axis"></div>
  <div id="gantt"></div>
  <div class="legend">
    <span><i style="background:#2563eb"></i>Комплексная</span>
    <span><i style="background:#7c3aed"></i>Тематическая</span>
    <span><i style="background:#0891b2"></i>Оперативная</span>
    <span><i style="background:#dc2626"></i>Внеплановая</span>
  </div>
</div>

<div class="p">
  <div class="sum" id="sum"></div>
  <div class="btns">
    <button onclick="addAll()">+ Внеплановая всем</button>
    <button onclick="clearExtra()">Сбросить</button>
  </div>
</div>

<div class="p"><div id="check"></div></div>

<script>
const $=id=>document.getElementById(id);
const M=["Я","Ф","М","А","М","И","И","А","С","О","Н","Д"];
const NAMES={К:"Комплексная",Т:"Тематическая",О:"Оперативная",В:"Внеплановая"};

const OPOS=[
 {id:1,name:"Кран мостовой №3",class:3,crit:2,extra:{}},
 {id:2,name:"Резервуар Р-12",class:2,crit:3,extra:{}},
 {id:3,name:"ГРС-1",class:1,crit:3,extra:{}},
 {id:4,name:"Компрессор К-5",class:4,crit:1,extra:{}}
];

function freq(o){
  const base={1:1,2:2,3:3,4:6}[o.class];
  if(o.crit===3)return Math.max(1,Math.round(base/2));
  if(o.crit===1)return Math.min(12,base*2);
  return base;
}
function plan(o){
  const f=freq(o), step=Math.max(1,Math.round(f/2)), res=[];
  for(let m=0;m<12;m++){
    let k="О";
    if(m%f===0)k="К";
    else if(m%step===0)k="Т";
    res.push({m,k});
  }
  Object.keys(o.extra).forEach(m=>{
    if(o.extra[m]){const e=res.find(x=>x.m==+m); if(e)e.k="В"; else res.push({m:+m,k:"В"})}
  });
  return res.sort((a,b)=>a.m-b.m);
}

function renderAxis(){
  $("axis").innerHTML=`<div style="width:120px;flex:0 0 120px"></div>`+
    M.map(m=>`<span>${m}</span>`).join("");
}

function renderGantt(){
  $("gantt").innerHTML=OPOS.map(o=>{
    const p=plan(o), f=freq(o);
    const dots=p.map(x=>{
      const left=(x.m+0.5)/12*100;
      return `<div class="dot ${x.k}" style="left:${left}%" title="${M[x.m]} — ${NAMES[x.k]}" onclick="toggle(${o.id},${x.m})"></div>`;
    }).join("");
    return `<div class="row">
      <div class="lbl">
        <span class="b c${o.class}">${o.class}</span>
        <span class="n" title="${o.name}">${o.name}</span>
        <div class="crit">
          ${[1,2,3].map(c=>`<button class="${o.crit===c?'on':''}" onclick="setCrit(${o.id},${c})">${c}</button>`).join("")}
        </div>
      </div>
      <div class="track">${dots}</div>
    </div>`;
  }).join("");
}
function setCrit(id,c){OPOS.find(o=>o.id===id).crit=c;renderAll()}
function toggle(id,m){const o=OPOS.find(x=>x.id===id);o.extra[m]=!o.extra[m];renderAll()}
function addAll(){OPOS.forEach(o=>{o.extra[5]=true});renderAll()}
function clearExtra(){OPOS.forEach(o=>o.extra={});renderAll()}

function renderSum(){
  const all=OPOS.flatMap(o=>plan(o));
  const c=k=>all.filter(x=>x.k===k).length;
  $("sum").innerHTML=`<b>Всего за год: ${all.length}</b> · К: ${c("К")} · Т: ${c("Т")} · О: ${c("О")} · В: ${c("В")}<br>
    <span style="color:#6b7280">Периодичность — от класса опасности и критичности. Клик по точке — внеплановая.</span>`;
}

function renderCheck(){
  const e=[];
  OPOS.forEach(o=>{
    if(o.class<=2 && freq(o)>4)e.push({bad:1,t:`${o.name}: класс ${o.class}, период ${freq(o)} мес. — редко`});
    if(o.crit===3 && !Object.values(o.extra).some(Boolean))e.push({t:`${o.name}: критичность 3 без резерва внеплановых`});
  });
  $("check").innerHTML=e.length
    ? e.map(x=>`<div class="warn ${x.bad?'bad':''}"><b>${x.bad?'⛔':'⚠'}</b>${x.t}</div>`).join("")
    : `<div class="warn ok"><b>✔ График сбалансирован</b>Периодичность соответствует риску, резерв внеплановых есть.</div>`;
}

function renderAll(){renderGantt();renderSum();renderCheck()}
renderAxis();renderAll();
</script></body></html>
