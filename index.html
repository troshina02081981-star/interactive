<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Диалог</title>
<style>
  body {
    margin: 0;
    background: #1e1e1e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Comic Sans MS', 'Segoe UI', Arial, sans-serif;
  }

  .scene {
    position: relative;
    width: 90%;
    max-width: 900px;
  }

  .scene img {
    display: block;
    width: 100%;
    border-radius: 10px;
  }

  /* ===== ОБЛАЧКА ===== */
  .bubble {
    position: absolute;
    background: #ffffff;
    color: #000;
    padding: 14px 18px;
    border: 3px solid #111;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.85);
    text-align: center;
  }

  /* ===== РУКОВОДИТЕЛЬ (не трогаем) ===== */
  .boss {
    left: -4%;
    top: 6%;
    max-width: 26%;
  }
  .boss::after {
    content: "";
    position: absolute;
    left: 70%;
    bottom: -26px;
    width: 0;
    height: 0;
    border-width: 26px 18px 0 0;
    border-style: solid;
    border-color: #111 transparent transparent transparent;
  }
  .boss::before {
    content: "";
    position: absolute;
    left: calc(70% + 3px);
    bottom: -18px;
    width: 0;
    height: 0;
    border-width: 18px 12px 0 0;
    border-style: solid;
    border-color: #ffffff transparent transparent transparent;
  }

  /* ===== РАБОТНИК — облачко прямо у рта ===== */
  .worker {
    right: 8%;              /* сдвинуто левее, ближе к лицу */
    top: 30%;               /* выше, к уровню рта */
    max-width: 22%;
  }
  /* Хвостик короткий, указывает точно на губы */
  .worker::after {
    content: "";
    position: absolute;
    right: 82%;             /* почти у правого края облачка */
    bottom: -18px;          /* идёт вниз, к рту */
    width: 0;
    height: 0;
    border-width: 18px 12px 0 0;
    border-style: solid;
    border-color: #111 transparent transparent transparent;
  }
  .worker::before {
    content: "";
    position: absolute;
    right: calc(82% + 3px);
    bottom: -12px;
    width: 0;
    height: 0;
    border-width: 12px 8px 0 0;
    border-style: solid;
    border-color: #ffffff transparent transparent transparent;
  }

  @media (max-width: 600px) {
    .bubble {
      font-size: 11px;
      padding: 10px 12px;
      border-width: 2px;
    }
  }
</style>
</head>
<body>

<div class="scene">
  <img src="pic.jpg" alt="Диалог в офисе">

  <div class="bubble boss">
    Затем, что документ — это ваша страховка. Не разберетесь в нем — подставите и себя, и людей рядом.
  </div>

  <div class="bubble worker">
    А зачем мне разбираться в документах? Я же не юрист, я на объекте работаю.
  </div>
</div>

</body>
</html>
