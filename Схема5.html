<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Универсальная формула</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 0;
        width: fit-content;
    }

    /* Заголовок */
    .header {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1.5px solid #b3d4ff;
        border-radius: 8px;
        padding: 4px 14px;
        color: #1e4bd8;
        font-weight: bold;
        font-size: 14px;
        background-color: #ffffff;
    }

    .header svg {
        width: 16px;
        height: 16px;
        stroke: #1e4bd8;
        fill: none;
        stroke-width: 2;
    }

    /* Основной блок с шагами */
    .flow {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f4f8ff;
        border: 1.5px solid #b3d4ff;
        border-radius: 10px;
        padding: 6px 4px;
        width: 85px;
        text-align: center;
        box-sizing: border-box;
    }

    .icon-circle {
        background: #1e4bd8;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 4px;
    }

    .icon-circle svg {
        width: 12px;
        height: 12px;
        stroke: #ffffff;
        fill: none;
        stroke-width: 2;
    }

    .box-title {
        font-size: 10px;
        font-weight: bold;
        color: #1e4bd8;
        margin-bottom: 2px;
    }

    .box-desc {
        font-size: 8px;
        color: #1e4bd8;
        line-height: 1.1;
    }

    .plus {
        color: #1e4bd8;
        font-weight: bold;
        font-size: 16px;
        margin: 0 -2px;
    }

    /* Подвал */
    .footer {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #f0f5ff;
        border-radius: 6px;
        padding: 4px 10px;
        width: 100%;
        box-sizing: border-box;
        margin-top: 2px;
    }

    .footer svg {
        width: 14px;
        height: 14px;
        stroke: #1e4bd8;
        fill: none;
        stroke-width: 2;
        flex-shrink: 0;
    }

    .footer span {
        font-size: 9px;
        color: #1e4bd8;
        font-weight: 600;
        line-height: 1.2;
    }
</style>
</head>
<body>

<div class="container">
    <!-- Верхний заголовок -->
    <div class="header">
        <svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V18h8v-3.3A7 7 0 0 0 12 2z"/></svg>
        <span>Универсальная формула</span>
    </div>

    <!-- Схема -->
    <div class="flow">
        <div class="box">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            </div>
            <div class="box-title">Задача</div>
            <div class="box-desc">Что нужно<br>сделать</div>
        </div>
        
        <div class="plus">+</div>

        <div class="box">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </div>
            <div class="box-title">Контекст</div>
            <div class="box-desc">Где и для чего</div>
        </div>

        <div class="plus">+</div>

        <div class="box">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <div class="box-title">Ограничения</div>
            <div class="box-desc">Что учитывать</div>
        </div>

        <div class="plus">+</div>

        <div class="box">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
            </div>
            <div class="box-title">Формат</div>
            <div class="box-desc">Как должен<br>выглядеть ответ</div>
        </div>
    </div>

    <!-- Подвал -->
    <div class="footer">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>Чем точнее вы сформулируете задачу, тем полезнее будет ответ нейросети.</span>
    </div>
</div>

</body>
</html>
