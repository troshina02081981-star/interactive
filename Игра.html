<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задание: проведите документ по маршруту</title>
<style>
    :root {
        --primary: #1b4f8a;
        --primary-light: #eaf3fb;
        --border: #d6e4f0;
        --ok: #2e7d32;
        --ok-bg: #e6f4ea;
        --warn: #c77700;
        --warn-bg: #fff4e0;
        --err: #d32f2f;
        --err-bg: #fdecea;
        --wait: #8a94a6;
        --text: #23394d;
        --muted: #4a6b8a;
    }
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #fff;
        color: var(--text);
        margin: 0;
        padding: 20px;
        font-size: 14px;
        line-height: 1.5;
    }
    .container {
        max-width: 640px;
        margin: 0 auto;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 12px rgba(30,80,140,0.08);
    }

    /* Стартовый экран */
    .start {
        text-align: center;
        padding: 24px 8px 12px;
    }
    .start h2 {
        margin: 0 0 8px;
        font-size: 19px;
        color: var(--primary);
    }
    .start p {
        margin: 0 0 20px;
        font-size: 13.5px;
        color: var(--muted);
    }
    .start .btn { font-size: 14px; padding: 11px 24px; }

    /* Игра */
    .game { display: none; }
    .game.active { display: block; }

    h2.game-title {
        margin: 0 0 4px;
        font-size: 17px;
        color: var(--primary);
        text-align: center;
    }
    .lead {
        margin: 0 0 16px;
        text-align: center;
        font-size: 12.5px;
        color: var(--muted);
    }
    .progress {
        height: 6px;
        background: var(--primary-light);
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .progress-bar {
        height: 100%;
        width: 0;
        background: var(--primary);
        border-radius: 20px;
        transition: width .3s;
    }

    /* Шаги: маленькие цветные иконки */
    .steps {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 2px;
        margin-bottom: 14px;
    }
    .step {
        flex: 1;
        text-align: center;
        padding: 4px 2px;
        border-radius: 8px;
        border: 1px solid transparent;
        transition: all .2s;
    }
    .step.active { background: var(--primary-light); border-color: var(--primary); }
    .step.done { background: var(--ok-bg); }

    .step .dot {
        width: 22px;
        height: 22px;
        margin: 0 auto 2px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        transition: transform .2s, opacity .2s;
        opacity: .55;
    }
    .step.active .dot,
    .step.done .dot { opacity: 1; transform: scale(1.08); }

    .step .dot svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

    /* цвета шагов */
    .dot-0 { background: #4a8bc2; }
    .dot-1 { background: #7b5ea7; }
    .dot-2 { background: #2e9e6b; }
    .dot-3 { background: #d98a1f; }
    .dot-4 { background: #c0504d; }

    .step .label {
        font-size: 9px;
        font-weight: 600;
        color: var(--muted);
        line-height: 1.2;
    }
    .step.active .label { color: var(--primary); }
    .step.done .label { color: var(--ok); }

    .panel {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        background: #f7fbff;
    }
    .panel h3 {
        margin: 0 0 4px;
        font-size: 14px;
        color: var(--primary);
    }
    .task {
        margin: 0 0 12px;
        font-size: 13px;
        color: var(--muted);
    }
    .options { display: grid; gap: 8px; margin-bottom: 12px; }
    .option {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        transition: all .15s;
    }
    .option:hover { border-color: var(--primary); }
    .option.selected { border-color: var(--primary); background: var(--primary-light); }
    .option.correct { border-color: var(--ok); background: var(--ok-bg); }
    .option.incorrect { border-color: var(--err); background: var(--err-bg); }
    .option input { margin-top: 2px; accent-color: var(--primary); }
    .option .txt { flex: 1; }
    .option .role { display: block; font-size: 11.5px; color: var(--muted); }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
        padding: 9px 16px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 8px;
        border: 1px solid var(--primary);
        background: var(--primary);
        color: #fff;
        cursor: pointer;
        transition: all .2s;
    }
    .btn:hover { background: #143d6b; }
    .btn.ghost { background: #fff; color: var(--primary); }
    .btn.ghost:hover { background: var(--primary-light); }

    .feedback {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 12.5px;
        display: none;
    }
    .feedback.show { display: block; }
    .feedback.good { background: var(--ok-bg); color: var(--ok); }
    .feedback.bad { background: var(--warn-bg); color: var(--warn); }
    .auto-note {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed currentColor;
        font-size: 12px;
        opacity: .95;
    }

    .result { text-align: center; padding: 6px 0; }
    .result .score {
        font-size: 34px;
        font-weight: 800;
        color: var(--primary);
        line-height: 1;
    }
    .result .score-label { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
    .result ul {
        text-align: left;
        font-size: 13px;
        padding-left: 20px;
        margin: 0 0 14px;
    }
    .result li { margin-bottom: 6px; }
    .result .summary {
        text-align: left;
        font-size: 13px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 14px;
    }

    @media (max-width: 480px) {
        .step .dot { width: 19px; height: 19px; }
        .step .dot svg { width: 10px; height: 10px; }
        .step .label { font-size: 8.5px; }
    }
</style>
</head>
<body>

<div class="container">

    <!-- Стартовый экран -->
    <div class="start" id="start">
        <h2>Проведите документ по маршруту</h2>
        <p>Пять решений, которые вы принимаете в работе. После каждого — разбор и объяснение, что здесь делает автоматизация.</p>
        <button class="btn" id="startBtn">Начать задание</button>
    </div>

    <!-- Игра -->
    <div class="game" id="game">
        <h2 class="game-title">Проведите документ по маршруту</h2>
        <p class="lead">Пять решений, которые вы принимаете в работе. После каждого — разбор</p>
        <div class="progress"><div class="progress-bar" id="bar"></div></div>
        <div class="steps" id="steps"></div>
        <div class="panel" id="panel"></div>
    </div>

</div>

<script>
const tasks = [
    {
        title: "Документ создан",
        icon: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>',
        label: "Создан",
        task: "Отметьте все поля, без которых документ не должен уйти дальше.",
        multi: true,
        options: [
            { id: "a", text: "Тип и название документа", correct: true },
            { id: "b", text: "Автор и дата", correct: true },
            { id: "c", text: "Привязка к объекту", correct: true },
            { id: "d", text: "Цвет шрифта", correct: false },
            { id: "e", text: "Кто утверждает", correct: true }
        ],
        good: "Верно: система проверит обязательные поля и не даст отправить документ с пропусками.",
        bad: "Не совсем. Цвет шрифта на безопасность не влияет, а вот тип, автор, объект и утверждающий обязательны: без них документ не пройдет дальше.",
        auto: "Обязательные поля и проверка пропусков — это работа системы. Без нее документ уходит дальше с ошибками, и их ловят уже на согласовании."
    },
    {
        title: "На согласовании",
        icon: '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
        label: "Согласование",
        task: "Выберите, кого включить в маршрут согласования инструкции для операторов. В маршрут идут только те, чья компетенция связана с содержанием.",
        multi: true,
        options: [
            { id: "a", text: "Начальник цеха", role: "работает по инструкции", correct: true },
            { id: "b", text: "Специалист по промбезопасности", role: "отвечает за содержание", correct: true },
            { id: "c", text: "Юрист", role: "проверяет формулировки", correct: false },
            { id: "d", text: "Главный инженер", role: "утверждает документ", correct: true },
            { id: "e", text: "Кадры", role: "не связаны с содержанием", correct: false }
        ],
        good: "Верно: начальник цеха, специалист по промбезопасности и утверждающий. Юрист и кадры не связаны с содержанием — их включение удлинит согласование.",
        bad: "Не совсем. Юрист и кадры не связаны с содержанием инструкции — их включение превращает согласование в переписку. Достаточно начальника цеха, специалиста по промбезопасности и утверждающего.",
        auto: "Маршрут строится в системе: участников вы выбираете один раз, дальше она сама ведет документ по шагам и напоминает о сроках. Без этого документ уходит всем подряд, и согласование тонет в переписке."
    },
    {
        title: "Утвержден",
        icon: '<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
        label: "Утвержден",
        task: "Выберите, какая редакция действует сейчас, а какая уходит в архив.",
        multi: false,
        options: [
            { id: "a", text: "Редакция 2.0", role: "утверждена 12.05, действует с 15.05", correct: true },
            { id: "b", text: "Редакция 1.2", role: "заменена, доступна для истории", correct: false }
        ],
        good: "Верно: действует 2.0, а 1.2 остается в архиве для истории. Так редакции не путаются.",
        bad: "Нет: действующая — 2.0, она утверждена позже и действует с 15.05. Редакция 1.2 заменена и уходит в архив.",
        auto: "Версионность ведет система: она помечает действующую редакцию и убирает старую в архив. Вручную легко перепутать, какая версия сейчас в работе."
    },
    {
        title: "На ознакомлении",
        icon: '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
        label: "Ознакомление",
        task: "Проверьте смену Б. Кому документ еще не направлен или кто не подтвердил ознакомление? Отметьте всех.",
        multi: true,
        options: [
            { id: "a", text: "Кузнецов, оператор", role: "✓ ознакомлен", correct: false },
            { id: "b", text: "Орлова, лаборант", role: "⏳ не открыла", correct: true },
            { id: "c", text: "Лебедев, слесарь", role: "⏳ не открыл", correct: true },
            { id: "d", text: "Смирнов, оператор", role: "✓ ознакомлен", correct: false }
        ],
        good: "Верно: Орлова и Лебедев еще не подтвердили ознакомление. В системе это видно сразу, без обзвона подразделений.",
        bad: "Не совсем. Не подтвердили Орлова и Лебедев — у них статус «не открыл». Кузнецов и Смирнов уже ознакомлены.",
        auto: "Статусы «ознакомлен / не открыл» существуют только в системе. Вручную пришлось бы обзванивать смены и собирать подписи по подразделениям."
    },
    {
        title: "Ознакомлены",
        icon: '<svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
        label: "Итог",
        task: "Документ доведен до работников. Отметьте подрядчиков, у которых нет подтверждения ознакомления.",
        multi: true,
        options: [
            { id: "a", text: "ООО «Монтаж-Сервис»", role: "✓ подтверждение есть", correct: false },
            { id: "b", text: "ООО «Высота»", role: "нет отметки", correct: true },
            { id: "c", text: "ИП Ковалев", role: "нет отметки", correct: true }
        ],
        good: "Верно: у «Высоты» и Ковалева нет подтверждения — их нужно направить и сохранить отметку. У «Монтаж-Сервис» подтверждение уже есть.",
        bad: "Не совсем. Без подтверждения — «Высота» и Ковалев. «Монтаж-Сервис» ознакомление подтвердил.",
        auto: "Подтверждения подрядчиков хранятся в системе — их можно предъявить при проверке, а не искать по папкам и журналам."
    }
];

let current = 0;
let answers = [];
let results = [];
let started = false;

const stepsEl = document.getElementById('steps');
const panelEl = document.getElementById('panel');
const barEl = document.getElementById('bar');
const gameEl = document.getElementById('game');
const startEl = document.getElementById('start');

function renderSteps() {
    stepsEl.innerHTML = tasks.map((t, i) => {
        let cls = 'step';
        if (i === current) cls += ' active';
        if (results[i] === true) cls += ' done';
        return `<div class="${cls}"><div class="dot dot-${i}">${t.icon}</div><div class="label">${t.label}</div></div>`;
    }).join('');
}

function updateBar() {
    const done = results.filter(r => r !== undefined).length;
    barEl.style.width = (done / tasks.length * 100) + '%';
}

function renderTask() {
    const t = tasks[current];
    const selected = answers[current] || [];
    const r = results[current];

    const optionsHtml = t.options.map(o => {
        let cls = 'option';
        if (selected.includes(o.id)) cls += ' selected';
        if (r !== undefined) {
            if (o.correct) cls += ' correct';
            else if (selected.includes(o.id)) cls += ' incorrect';
        }
        return `<label class="${cls}">
            <input type="${t.multi ? 'checkbox' : 'radio'}" name="opt" value="${o.id}" ${selected.includes(o.id) ? 'checked' : ''} ${r !== undefined ? 'disabled' : ''}>
            <span class="txt">${o.text}${o.role ? `<span class="role">${o.role}</span>` : ''}</span>
        </label>`;
    }).join('');

    let feedbackHtml = '';
    if (r !== undefined) {
        feedbackHtml = `<div class="feedback show ${r ? 'good' : 'bad'}">
            ${r ? t.good : t.bad}
            <div class="auto-note"><b>Что здесь делает автоматизация:</b> ${t.auto}</div>
        </div>`;
    }

    let buttons = '';
    if (r === undefined) {
        buttons = `<div class="btn-row"><button class="btn" id="checkBtn">Проверить</button></div>`;
    } else {
        buttons = `<div class="btn-row">
            ${current < tasks.length - 1
                ? '<button class="btn" id="nextBtn">Дальше</button>'
                : '<button class="btn" id="finishBtn">Показать результат</button>'}
        </div>`;
    }

    panelEl.innerHTML = `
        <h3>${t.title}</h3>
        <p class="task">${t.task}</p>
        <div class="options" id="options">${optionsHtml}</div>
        ${buttons}
        ${feedbackHtml}
    `;

    panelEl.querySelectorAll('input[name="opt"]').forEach(inp => {
        inp.addEventListener('change', () => {
            if (results[current] !== undefined) return;
            const val = inp.value;
            let arr = answers[current] || [];
            if (t.multi) {
                if (inp.checked) arr = [...arr, val];
                else arr = arr.filter(x => x !== val);
            } else {
                arr = [val];
            }
            answers[current] = arr;
            renderTask();
        });
    });

    const checkBtn = document.getElementById('checkBtn');
    if (checkBtn) {
        checkBtn.addEventListener('click', () => {
            const sel = answers[current] || [];
            if (sel.length === 0) return;
            const correctIds = t.options.filter(o => o.correct).map(o => o.id);
            results[current] = correctIds.length === sel.length && correctIds.every(id => sel.includes(id));
            renderSteps();
            updateBar();
            renderTask();
        });
    }

    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn) {
        nextBtn.addEventListener('click', () => {
            current++;
            renderSteps();
            renderTask();
        });
    }

    const finishBtn = document.getElementById('finishBtn');
    if (finishBtn) {
        finishBtn.addEventListener('click', renderResult);
    }
}

function renderResult() {
    const score = results.filter(r => r === true).length;
    let verdict = '';
    if (score === 5) verdict = 'Отлично: вы провели документ по маршруту без ошибок.';
    else if (score >= 3) verdict = 'Хорошо: основа понятна, но есть места, где стоит быть внимательнее.';
    else verdict = 'Стоит вернуться к шагам: в маршруте и ознакомлении есть типичные ошибки.';

    panelEl.innerHTML = `
        <div class="result">
            <div class="score">${score} / 5</div>
            <div class="score-label">верных решений</div>
            <p style="font-size:13px;margin:0 0 12px;">${verdict}</p>
            <ul>
                ${tasks.map((t, i) => `<li>${results[i] ? '✓' : '✕'} ${t.title}</li>`).join('')}
            </ul>
            <div class="summary">
                <b>Что здесь делает автоматизация.</b> Вы прошли маршрут, который вручную занимает дни: выбор согласующих, контроль редакций, поиск неознакомленных, подтверждения подрядчиков. В системе каждое из этих решений занимает минуты, а все действия сохраняются в истории. Это и есть автоматизация документооборота: не отдельная программа, а маршрут, который ведется сам.
            </div>
            <div class="btn-row" style="justify-content:center;">
                <button class="btn ghost" id="restartBtn">Пройти заново</button>
            </div>
        </div>
    `;

    document.getElementById('restartBtn').addEventListener('click', () => {
        current = 0;
        answers = [];
        results = [];
        renderSteps();
        updateBar();
        renderTask();
    });
}

document.getElementById('startBtn').addEventListener('click', () => {
    started = true;
    startEl.style.display = 'none';
    gameEl.classList.add('active');
    renderSteps();
    updateBar();
    renderTask();
});
</script>

</body>
</html>
